<!doctype html>
<!-- 포즈 러너 프론트엔드 전부. 게임 로직과 화면이 이 파일 하나에 들어간다 -->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>포즈 러너</title>
  <!-- 표제용 서체. 네온 글로우는 획이 굵어야 살아서 한글까지 덮는 헤비 페이스를 쓴다.
       못 받아오면 시스템 고딕으로 떨어질 뿐 화면은 그대로 돈다 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet" />
  <!-- 3D 엔진. 모듈 스크립트가 boot() 안에서 필요할 때 부른다 — ?test=1 은 부르지 않는다 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
  <style>
    /* ── 세계관 토큰 — 밤의 터널: 깊은 남색 바탕, 보랏빛 지평선, 청록 네온.
       캔버스도 같은 값을 쓴다 (아래 "── 팔레트" 섹션과 짝을 맞춘다) */
    :root {
      --void: #05070f;
      --deep: #0a0e1f;
      --panel: #0d1226;
      --panel-2: #121a35;
      --edge: rgba(125, 214, 255, 0.16);
      --edge-strong: rgba(125, 214, 255, 0.38);
      --ink: #eaf1ff;
      --ink-dim: #98abd0;
      --ink-faint: #7488b0;
      --cyan: #4de3ff;
      --mint: #7ef6a0;
      --gold: #ffd34d;
      --ember: #ff6a4d;
      --violet: #b06dff;
      --r: 14px;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --display: 'Black Han Sans', 'Apple SD Gothic Neo', system-ui, sans-serif;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0; background: var(--deep); color: var(--ink);
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* 브라우저가 기본으로 그려주는 것들도 이 세계에 속한다 */
    ::selection { background: rgba(77, 227, 255, 0.32); color: #fff; }
    :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

    #stage { position: relative; width: 100vw; height: 100dvh; }
    #canvas { display: block; width: 100%; height: 100%; }
    /* 3D 캔버스 위에 얹는 투명 층. 점수판과 비네트만 그린다. 클릭은 아래로 통과시킨다 */
    #hud { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    /* ── 카메라 미리보기 */
    #cam {
      position: absolute; right: 18px; bottom: 18px; z-index: 1;
      width: 200px; border-radius: 12px; overflow: hidden; line-height: 0;
      border: 1px solid var(--edge);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      background: #05070f;
    }
    /* 영상은 포즈 인식의 입력일 뿐 화면에는 내지 않는다. 자리는 차지해야 미리보기 크기가
       영상 비율을 따라온다 (display:none 은 안 된다 — 크기가 0 이 된다) */
    #preview { display: block; width: 100%; visibility: hidden; }
    /* 준비 화면에서는 미리보기가 가운데로 나와 커진다. 2m 뒤에서도 선과 점이 읽혀야 한다.
       .screen(z 3) 위에 올라와야 그 흐림 처리에 가려지지 않는다 */
    #cam.align {
      right: auto; bottom: auto; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: auto; z-index: 4;
      border-color: var(--edge-strong);
    }
    /* 높이로 맞추고 폭은 비율을 따른다. 좁은 창에서는 max-width 가 비율을 지키며 줄인다 */
    #cam.align #preview { width: auto; height: 62vh; max-width: 88vw; }
    /* 오버레이가 곧 미리보기다. 졸라맨은 x 를 1 - x 로 그려 거울처럼 보인다 —
       캔버스에 scaleX(-1) 을 걸면 글자까지 뒤집힌다 */
    #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* ── 디버그 패널 — 튜닝 도구다. 꾸미지 않고 읽히기만 하면 된다 */
    #debug {
      position: absolute; left: 18px; bottom: 18px; z-index: 1;
      width: 260px; padding: 12px 14px; border-radius: 12px;
      background: rgba(8, 12, 26, 0.88); border: 1px solid var(--edge);
      font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #debug h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.04em; }
    #debug label { display: block; margin-top: 8px; }
    #debug input[type=range] { width: 100%; accent-color: var(--cyan); }
    #debug .row { display: flex; justify-content: space-between; }

    /* ── 경고 배너 — 지금 조작이 안 먹는 이유를 알려주는 유일한 통로다.
       시작 화면(.screen)보다 위에 둔다 — 3D 를 못 불러온 이유는 시작 화면에서 읽혀야 한다 */
    #banner {
      position: absolute; top: 20px; left: 50%; z-index: 5;
      transform: translateX(-50%);
      padding: 11px 20px; border-radius: 999px;
      background: rgba(255, 106, 77, 0.14);
      border: 1px solid rgba(255, 106, 77, 0.55);
      color: #ffcbbf;
      font-size: 14px; font-weight: 600; display: none;
      backdrop-filter: blur(12px);
      animation: drop 0.32s var(--ease);
    }
    @keyframes drop { from { opacity: 0; transform: translate(-50%, -14px); } }

    #toast {
      position: absolute; bottom: 26px; left: 50%; z-index: 2;
      transform: translateX(-50%);
      padding: 11px 20px; border-radius: 999px; font-size: 14px;
      background: rgba(13, 18, 38, 0.92); border: 1px solid var(--edge);
      color: var(--ink); display: none;
      backdrop-filter: blur(12px);
      animation: rise 0.32s var(--ease);
    }
    @keyframes rise { from { opacity: 0; transform: translate(-50%, 14px); } }

    /* ── 화면 — 캔버스 위에 덮인다. 뒤의 트랙이 비쳐야 게임 안에 있는 느낌이 산다 */
    .screen {
      position: absolute; inset: 0; z-index: 3;
      display: flex; align-items: center; justify-content: center;
      padding: 28px; overflow: auto;
      background:
        radial-gradient(120% 90% at 50% 0%, rgba(90, 40, 160, 0.30), transparent 60%),
        rgba(5, 7, 15, 0.62);
      backdrop-filter: blur(7px) saturate(1.15);
    }
    .hidden { display: none !important; }

    .panel {
      width: min(880px, 100%);
      padding: 34px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(18, 26, 53, 0.86), rgba(10, 14, 31, 0.9));
      border: 1px solid var(--edge);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      animation: enter 0.5s var(--ease);
    }
    @keyframes enter { from { opacity: 0; transform: translateY(18px) scale(0.985); } }

    .title {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(44px, 8vw, 76px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: #fff;
      /* 네온은 장식이 아니라 이 세계의 광원이다 */
      text-shadow:
        0 0 8px rgba(77, 227, 255, 0.6),
        0 0 26px rgba(77, 227, 255, 0.38),
        0 0 60px rgba(77, 227, 255, 0.2);
    }

    .lede { margin: 0; color: var(--ink-dim); line-height: 1.75; font-size: 15px; }
    .lede.dim { color: var(--ink-faint); font-size: 13px; }

    /* ── 시작 화면 — 넓으면 좌우로, 좁으면 위아래로 */
    .start-panel {
      display: grid; gap: 34px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 760px) {
      .start-panel { grid-template-columns: 1.15fr 0.85fr; align-items: start; }
      .start-rank { border-left: 1px solid var(--edge); padding-left: 34px; }
    }
    .start-main { display: flex; flex-direction: column; gap: 18px; }

    .field { display: flex; gap: 10px; margin-top: 4px; }
    #nickname {
      flex: 1; min-width: 0;
      padding: 14px 16px; font-size: 16px;
      border-radius: var(--r);
      border: 1px solid var(--edge);
      background: rgba(5, 7, 15, 0.6);
      color: var(--ink);
      caret-color: var(--cyan);
      transition: border-color 0.2s var(--ease), background 0.2s var(--ease);
    }
    #nickname::placeholder { color: var(--ink-faint); }
    #nickname:focus {
      outline: none;
      border-color: var(--edge-strong);
      background: rgba(5, 7, 15, 0.85);
    }
    #nickname:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    button {
      padding: 14px 30px; font-size: 16px; font-weight: 700; cursor: pointer;
      border-radius: var(--r); border: 0;
      background: var(--mint); color: #062012;
      font-family: inherit;
      transition: transform 0.18s var(--ease), box-shadow 0.18s var(--ease), filter 0.18s var(--ease);
      box-shadow: 0 6px 18px rgba(126, 246, 160, 0.22);
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(126, 246, 160, 0.34); }
    button:active { transform: translateY(0); filter: brightness(0.94); }
    button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ── 조작 안내 — 키에 적힌 글자를 키 모양 그대로 보여준다 */
    .keys { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 9px; }
    .keys li {
      display: flex; align-items: center; gap: 10px;
      font-size: 13px; color: var(--ink-dim);
    }
    .cap {
      min-width: 26px; height: 26px; padding: 0 7px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 7px;
      border: 1px solid var(--edge);
      border-bottom-width: 2px;
      background: rgba(5, 7, 15, 0.7);
      color: var(--ink);
      font-size: 12px; font-weight: 600;
    }

    /* ── 랭킹 */
    .start-rank h2 {
      margin: 0 0 14px;
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ink-faint);
    }
    #ranking { list-style: none; padding: 0; margin: 0; max-height: 470px; overflow-y: auto; }
    #ranking li {
      display: grid; grid-template-columns: 26px 1fr auto;
      align-items: center; gap: 10px;
      padding: 9px 2px;
      border-bottom: 1px solid rgba(125, 214, 255, 0.08);
      font-size: 14px;
    }
    #ranking li:last-child { border-bottom: 0; }
    .rk { font-size: 12px; font-weight: 700; color: var(--ink-faint); text-align: center; }
    .rk-1 { color: var(--gold); }
    .rk-2 { color: #d7e2f5; }
    .rk-3 { color: #e0a06a; }
    .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sc { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink); }
    /* 안내 문구는 등수 칸에 들어갈 것이 아니다. 격자를 벗어나 한 줄로 흐른다 */
    #ranking li.rank-note {
      display: block; border-bottom: 0;
      color: var(--ink-faint); font-size: 13px; padding: 9px 2px;
    }
    #ranking::-webkit-scrollbar { width: 6px; }
    #ranking::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 3px; }
    #ranking::-webkit-scrollbar-track { background: transparent; }

    /* ── 준비 화면 — 안내 문구는 위, 남은 시간은 아래. 가운데는 카메라(#cam.align)가 차지한다 */
    #countdown { flex-direction: column; justify-content: space-between; }
    .align-msg {
      margin: 0; text-align: center;
      font-size: clamp(17px, 2.6vh, 23px); font-weight: 600; color: #fff;
      text-shadow: 0 0 12px rgba(77, 227, 255, 0.35);
    }
    .ring { position: relative; display: grid; place-items: center; width: 116px; height: 116px; }
    .ring-track {
      position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(
        from -90deg,
        var(--cyan) calc(var(--p, 1) * 360deg),
        rgba(125, 214, 255, 0.12) 0
      );
      -webkit-mask: radial-gradient(circle, transparent 50px, #000 51px);
              mask: radial-gradient(circle, transparent 50px, #000 51px);
      filter: drop-shadow(0 0 14px rgba(77, 227, 255, 0.45));
    }
    #count {
      position: relative;
      font-family: var(--display); font-weight: 400;
      font-size: 54px; line-height: 1; color: #fff;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 10px rgba(77, 227, 255, 0.55), 0 0 44px rgba(77, 227, 255, 0.28);
    }

    /* ── 결과 화면 */
    .over-panel {
      width: min(460px, 100%);
      display: flex; flex-direction: column; align-items: center; gap: 18px;
      text-align: center;
    }
    .score-big {
      margin: 0;
      font-family: var(--display); font-weight: 400;
      font-size: clamp(64px, 14vw, 104px); line-height: 1; color: #fff;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 10px rgba(126, 246, 160, 0.5), 0 0 46px rgba(126, 246, 160, 0.24);
    }
    .score-big .unit { font-size: 0.34em; color: var(--ink-dim); margin-left: 0.22em; text-shadow: none; }
    .status { margin: 0; display: flex; align-items: center; gap: 9px; font-size: 14px; color: var(--ink-dim); }
    .status::before {
      content: ''; width: 7px; height: 7px; border-radius: 50%;
      background: var(--ink-faint); flex: none;
    }
    .status.ok::before { background: var(--mint); box-shadow: 0 0 10px rgba(126, 246, 160, 0.7); }
    .status.bad::before { background: var(--ember); box-shadow: 0 0 10px rgba(255, 106, 77, 0.7); }
    /* 2.5초 뒤 시작 화면으로 돌아간다. 얼마나 남았는지 보여준다 */
    .restart-bar { width: 150px; height: 2px; background: var(--edge); border-radius: 2px; overflow: hidden; }
    .restart-bar i { display: block; height: 100%; background: var(--cyan); transform-origin: left; }
    .restart-bar.run i { animation: drain 2.5s linear forwards; }
    @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    /* 움직임에 민감한 사용자에게는 연출을 걷어낸다. 게임 자체는 내용이라 남긴다 */
    @media (prefers-reduced-motion: reduce) {
      .panel, #banner, #toast { animation: none; }
      .restart-bar.run i { animation: none; transform: scaleX(0); }
      button { transition: none; }
      button:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="canvas"></canvas>
    <canvas id="hud"></canvas>
    <div id="cam" class="hidden">
      <video id="preview" playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <div id="banner" role="status"></div>
    <div id="debug" class="hidden"></div>

    <div id="start" class="screen">
      <div class="panel start-panel">
        <div class="start-main">
          <h1 class="title">포즈 러너</h1>
          <p class="lede">앉아서 닉네임을 넣고 시작을 누르세요.<br />
             시작하면 카메라 화면의 두 선에 눈과 골반을 맞춰 서세요.<br />
             맞춘 채로 5초가 지나면 게임이 시작됩니다.</p>
          <div class="field">
            <input id="nickname" maxlength="12" placeholder="닉네임 (최대 12자)" aria-label="닉네임" />
            <button id="start-btn">시작</button>
          </div>
          <ul class="keys">
            <li><span class="cap">←</span><span class="cap">→</span> 몸을 좌우로 옮기거나 방향키로 레인 이동</li>
            <li><span class="cap">↑</span><span class="cap">Space</span> 제자리에서 뛰면 점프</li>
            <li><span class="cap">↓</span> 쪼그리면 슬라이드</li>
            <li><span class="cap">D</span> 디버그 패널 열기</li>
          </ul>
          <p class="lede dim">카메라를 못 쓰면 방향키로 그대로 플레이할 수 있습니다.</p>
        </div>
        <aside class="start-rank">
          <h2>Top 10</h2>
          <ol id="ranking"><li class="rank-note">불러오는 중…</li></ol>
        </aside>
      </div>
    </div>

    <div id="countdown" class="screen hidden">
      <p id="align-msg" class="align-msg">눈과 골반을 선에 맞춰 서세요</p>
      <div class="ring">
        <div class="ring-track" id="ring-track"></div>
        <div id="count">5</div>
      </div>
    </div>

    <div id="gameover" class="screen hidden">
      <div class="panel over-panel">
        <h1 id="final-score" class="score-big">0<span class="unit">점</span></h1>
        <p id="submit-state" class="status">점수를 보내는 중…</p>
        <div class="restart-bar" id="restart-bar"><i></i></div>
      </div>
    </div>

    <div id="toast" role="status"></div>
  </div>
  <script type="module">
    // ── 상수·랜드마크 인덱스·공용 헬퍼
    // MediaPipe 랜드마크 인덱스. 좌우 쌍은 중점을 쓴다
    const LM = {
      EYE_L: 2, EYE_R: 5,
      SHO_L: 11, SHO_R: 12,
      HIP_L: 23, HIP_R: 24,
    };

    const DEFAULT_CFG = {
      // 몸통 길이 대비. 두 발 점프 실측 봉우리 0.19 의 약 78%.
      // 봉우리에 딱 맞추면 매번 같은 높이로 뛸 수 없어 절반이 안 걸린다
      jumpThreshold: 0.15,
      slideThreshold: 0.5,    // 몸통 길이 대비. 이만큼 숙이면 슬라이드가 걸린다
      // 슬라이드를 푸는 문턱. 거는 문턱보다 낮게 둬 경계에서 떠는 것을 막는다.
      // 이 히스테리시스가 없으면 문턱 근처에서 한 프레임 떨어질 때 마침 가로보가
      // 지나가면 억울하게 죽는다. 레인이 laneOut/laneIn 을 쓰는 것과 같은 이유다
      slideRelease: 0.7,      // slideThreshold 대비 비율
      baselineAlpha: 0.02,    // 기준선 추종 EMA
      // 판정도 아닌데 조용함 대역 밖 이탈이 이만큼 지속되면 기준선이 틀린 것으로 본다.
      // 점프의 상승 구간도 잠깐은 대역 밖인데 아직 판정 전이라 잠금이 없다.
      // 짧으면 뜨는 도중에 기준선이 머리를 따라가 점프가 죽으므로 넉넉히 둔다
      baselineResetMs: 1500,
      laneAlpha: 0.3,         // 레인 x EMA
      animMs: 600,            // Game의 JUMP_MS와 값을 맞춰야 한다 (아래 "── Game" 섹션)
      refractoryMs: 300,
      // 가운데에서 0.10 만 벗어나도 레인이 바뀐다 (예전엔 0.20 이라 너무 멀리 가야 했다).
      // laneIn 은 되돌아올 때의 문턱이라 laneOut 안쪽에 둬 경계에서 떠는 것을 막는다
      laneOutLeft: 0.40,      // 가운데 → 왼쪽
      laneOutRight: 0.60,     // 가운데 → 오른쪽
      laneInLeft: 0.46,       // 왼쪽 → 가운데
      laneInRight: 0.54,      // 오른쪽 → 가운데
    };

    function midpoint(a, b) {
      return {
        x: (a.x + b.x) / 2,
        y: (a.y + b.y) / 2,
      };
    }

    // y는 아래로 갈수록 커진다. 위로 올라감 = y 감소
    function poseMetrics(lm) {
      const shoulder = midpoint(lm[LM.SHO_L], lm[LM.SHO_R]);
      const hip = midpoint(lm[LM.HIP_L], lm[LM.HIP_R]);
      const eye = midpoint(lm[LM.EYE_L], lm[LM.EYE_R]);
      const torsoLen = Math.abs(shoulder.y - hip.y);
      return { shoulder, hip, eye, torsoLen };
    }

    // ── 자세 정렬 — 준비 화면에서 눈과 골반을 이 높이에 맞추게 한다.
    // 눈 위로 22%, 골반 아래로 38% 가 남는 구도다. 점프로 머리가 뜨는 양(화면의 ~5%)과
    // 쪼그려서 골반이 내려가는 양(~13%) 이 둘 다 화면 안에 머문다. 대략 무릎까지 보인다.
    // 세 값은 계산으로 잡은 초기값이다 — 실제 카메라로 서 보고 조정한다
    const ALIGN = { eyeY: 0.22, hipY: 0.62, tol: 0.05 };

    // 눈·골반이 둘 다 선의 허용 오차 안이면 정렬이다. 아니면 사용자가 할 일 한 가지를 준다 —
    // 거리부터, 그 다음 높이. 거리가 틀리면 높이는 맞춰봐야 소용없으니 먼저 본다.
    // 간격이 맞는데 위아래로 치우쳤으면 몸이 아니라 카메라 각도 문제다
    function alignCheck(m, a = ALIGN) {
      const eyeOff = m.eye.y - a.eyeY;    // 양수면 선보다 아래
      const hipOff = m.hip.y - a.hipY;
      if (Math.abs(eyeOff) <= a.tol && Math.abs(hipOff) <= a.tol) return { aligned: true, hint: null };
      const spanErr = hipOff - eyeOff;    // 눈-골반 간격 오차. 멀수록 작게 보이니 음수
      if (spanErr < -a.tol) return { aligned: false, hint: '앞으로 오세요' };
      if (spanErr > a.tol) return { aligned: false, hint: '뒤로 물러나세요' };
      return { aligned: false, hint: eyeOff + hipOff < 0 ? '카메라를 위로 기울이세요' : '카메라를 아래로 기울이세요' };
    }
    // ── 졸라맨 — 카메라 영상 대신 관절만 그린다. 어떤 뼈를 그릴지는 여기서 정한다.
    // 어깨와 골반은 좌우 중점 하나로 그린다 — 게임이 읽는 값도 그 중점이다.
    // 랜드마크 배열 끝(33, 34)에 두 중점을 덧붙여 뼈 목록이 같은 방식으로 가리키게 한다
    const SHO_MID = 33, HIP_MID = 34;
    const BONES = [
      [SHO_MID, HIP_MID],                                   // 척추
      [SHO_MID, 13], [13, 15], [SHO_MID, 14], [14, 16],     // 팔
      [HIP_MID, 25], [25, 27], [HIP_MID, 26], [26, 28],     // 다리
      [27, 31], [28, 32],                                   // 발
    ];
    const JOINTS = [SHO_MID, 13, 14, 15, 16, 25, 26, 27, 28];   // 흰 점을 찍는 관절. 골반 중점은 색을 달리한다
    // 화면 밖으로 나간 부위도 추정치는 나온다. 그건 그리지 않는다 —
    // 앉아 있으면 다리가 사라져, 안 보인다는 사실이 그대로 보인다
    const seen = (p) => (p.visibility ?? 1) >= 0.5;
    // 중점은 두 점의 평균이라 한쪽이 안 보이면 그 평균도 믿을 수 없다. 약한 쪽을 따른다
    function withMidpoints(lm) {
      const mid = (a, b) =>
        ({ ...midpoint(a, b), visibility: Math.min(a.visibility ?? 1, b.visibility ?? 1) });
      return [...lm, mid(lm[LM.SHO_L], lm[LM.SHO_R]), mid(lm[LM.HIP_L], lm[LM.HIP_R])];
    }
    function visibleBones(pts) {
      return BONES.filter(([a, b]) => seen(pts[a]) && seen(pts[b]));
    }
    // ── InputMapper — 랜드마크를 조작 신호로 바꾼다. 카메라도 게임도 모른다
    function createInputMapper(overrides = {}) {
      const cfg = { ...DEFAULT_CFG, ...overrides };
      let baseline = null;          // { eyeY }
      let calibSamples = [];
      let smoothedLaneX = null;
      let lane = 1;
      let lockUntilMs = 0;
      let jumpWasOver = false;
      let sliding = false;          // 엣지가 아니라 유지되는 자세다
      let lastSignal = { lane: 1, jump: false, slide: false, warning: null };
      let excursionSinceMs = null;  // 현재 이탈이 시작된 시각. 기준선이 틀렸는지 재는 데 쓴다
      let peakHeadRise = 0;         // 봉우리는 2~3 프레임이라 실시간으로는 못 읽는다. 붙들어서 실측에 쓴다
      let debug = { headRise: 0, peakHeadRise: 0, laneX: 0.5 };

      function addCalibrationSample(lm) {
        if (!lm) return;
        const m = poseMetrics(lm);
        if (m.torsoLen < 1e-6) return;
        calibSamples.push({ eyeY: m.eye.y });
      }

      function commitCalibration() {
        if (calibSamples.length === 0) return false;
        const n = calibSamples.length;
        baseline = {
          eyeY: calibSamples.reduce((s, c) => s + c.eyeY, 0) / n,
        };
        peakHeadRise = 0;   // 기준선이 바뀌면 이전 봉우리는 의미가 없다
        debug.peakHeadRise = 0;   // debug 는 update() 가 다시 돌기 전까지 남는 스냅샷이라 직접 갱신한다
        excursionSinceMs = null;  // 새 기준선에 대한 이탈은 아직 없다
        calibSamples = [];
        return true;
      }

      // 포즈가 끊긴 동안에는 마지막 자세를 붙든다. 레인과 같은 이유다 —
      // 한 프레임 놓쳤다고 자세를 풀면 마침 가로보가 지나갈 때 억울하게 죽는다.
      // jump 만 false 인 것은 엣지라서다. 다시 뜰 때 새 엣지로 발화한다
      function hold(warning) {
        // 이탈이 지속됐다는 주장은 실제로 본 프레임에서만 할 수 있다.
        // 안 보이는 동안 흐른 시간을 세면 돌아오자마자 기준선을 스냅해버린다
        excursionSinceMs = null;
        lastSignal = { lane: lastSignal.lane, jump: false, slide: sliding, warning };
        return lastSignal;
      }

      function update(lm, nowMs) {
        if (!lm) return hold('포즈를 찾을 수 없습니다');
        if (!baseline) return hold('캘리브레이션 전입니다');

        const m = poseMetrics(lm);
        if (m.torsoLen < 1e-6) return hold('포즈를 찾을 수 없습니다');

        // 레인 — 웹캠은 거울이 아니므로 뒤집는다. 엉덩이 중점을 쓴다 (머리는 흔들린다)
        const laneX = 1 - m.hip.x;
        smoothedLaneX = smoothedLaneX === null
          ? laneX
          : smoothedLaneX + cfg.laneAlpha * (laneX - smoothedLaneX);
        if (lane === 1) {
          if (smoothedLaneX < cfg.laneOutLeft) lane = 0;
          else if (smoothedLaneX > cfg.laneOutRight) lane = 2;
        } else if (lane === 0) {
          if (smoothedLaneX > cfg.laneInLeft) lane = 1;
        } else {
          if (smoothedLaneX < cfg.laneInRight) lane = 1;
        }

        // 몸통 길이로 나눠 거리 변화에 무관하게 만든다.
        // 눈 y 에는 EMA 를 걸지 않는다. 빠뜨린 게 아니라 의도적이다 —
        // 점프는 짧고 빠른 순간 신호라 스무딩하면 봉우리가 뭉개져 감지 자체가 안 된다
        const headRise = (baseline.eyeY - m.eye.y) / m.torsoLen;   // 머리가 뜨면 양수

        // 슬라이드는 자세다 — 숙이고 있는 동안 유지되고 몸을 세우면 풀린다.
        // 걸 때는 slideThreshold, 풀 때는 그보다 낮은 문턱을 쓴다
        sliding = sliding
          ? headRise < -cfg.slideThreshold * cfg.slideRelease
          : headRise < -cfg.slideThreshold;
        const slide = sliding;

        // 점프는 탄도다 — 뜬 순간이 전부이므로 상승 엣지에서 한 번만 발화하고
        // 애니메이션+불응기 동안 잠근다.
        // 숙인 채로 뛸 수 없다는 것은 따로 막지 않아도 된다. 점프와 슬라이드가
        // 한 축의 양끝이라 두 조건이 동시에 참일 수가 없다
        const locked = nowMs < lockUntilMs;
        const jumpOver = headRise > cfg.jumpThreshold;
        let jump = false;
        if (!locked && jumpOver && !jumpWasOver) {
          jump = true;
          lockUntilMs = nowMs + cfg.animMs + cfg.refractoryMs;
        }
        jumpWasOver = jumpOver;
        if (headRise > peakHeadRise) peakHeadRise = headRise;

        // 판정 중 — 이때의 눈 y 는 조작 신호이지 기준이 아니다
        const judging = locked || jump || slide;

        // 기준선 추종 — 판정 중에는 절대 갱신하지 않는다.
        // 이 가드가 없으면 슬라이드 자세가 기준선으로 굳어 슬라이드가 영영 안 먹는다
        const quiet = Math.abs(headRise) < Math.min(cfg.jumpThreshold, cfg.slideThreshold) / 2;
        if (quiet && !judging) {
          baseline.eyeY += cfg.baselineAlpha * (m.eye.y - baseline.eyeY);
        }

        // 기준선 오류 복구 — 판정도 아닌데 대역 밖 이탈이 오래 지속되면 남는 해석이
        // 없다. 점프는 탄도라 이만큼 못 버티고 슬라이드는 자기 임계로 이미 걸러진다.
        // 그러니 이건 기준선이 틀린 것이고, 현재 눈 y 로 스냅해 바로잡는다.
        // 이 복구가 없으면 오차가 대역보다 커진 순간 그 오차를 지울 유일한 수단인
        // 추종이 바로 그 오차 때문에 꺼져 스스로 빠져나올 수 없다
        if (quiet || judging) {
          excursionSinceMs = null;
        } else if (excursionSinceMs === null) {
          excursionSinceMs = nowMs;
        } else if (nowMs - excursionSinceMs >= cfg.baselineResetMs) {
          baseline.eyeY = m.eye.y;
          excursionSinceMs = null;
          peakHeadRise = 0;   // 기준선이 바뀌면 이전 봉우리는 의미가 없다
        }

        // 기준선과 몸통 길이는 프리뷰 오버레이가 임계선을 그리는 데 쓴다.
        // 판정이 매 프레임의 torsoLen 으로 이뤄지므로 오버레이도 같은 값을 써야
        // 화면의 선과 실제 판정 경계가 어긋나지 않는다
        debug = {
          headRise, peakHeadRise, laneX: smoothedLaneX,
          baselineEyeY: baseline.eyeY,
          torsoLen: m.torsoLen,
        };
        lastSignal = { lane, jump, slide, warning: null };
        return lastSignal;
      }

      return {
        addCalibrationSample,
        commitCalibration,
        update,
        cfg,
        getDebug: () => debug,
      };
    }
    // ── 셀프 테스트 — 단일 파일 제약으로 외부 러너를 못 붙이는 것에 대한 우회
    function makePose({
      hipX = 0.5,
      eyeY = 0.10,
      shoulderY = 0.30,
      hipY = 0.55,
      visibility = 1.0,
    } = {}) {
      const lm = Array.from({ length: 33 }, () => ({ x: hipX, y: 0.5, z: 0, visibility }));
      lm[LM.EYE_L] = { x: hipX - 0.02, y: eyeY, z: 0, visibility };
      lm[LM.EYE_R] = { x: hipX + 0.02, y: eyeY, z: 0, visibility };
      lm[LM.SHO_L] = { x: hipX - 0.08, y: shoulderY, z: 0, visibility };
      lm[LM.SHO_R] = { x: hipX + 0.08, y: shoulderY, z: 0, visibility };
      lm[LM.HIP_L] = { x: hipX - 0.05, y: hipY, z: 0, visibility };
      lm[LM.HIP_R] = { x: hipX + 0.05, y: hipY, z: 0, visibility };
      return lm;
    }

    function runSelfTests() {
      const results = [];
      const assert = (cond, msg) => { if (!cond) throw new Error(msg); };

      function check(name, fn) {
        try { fn(); results.push({ name, ok: true }); }
        catch (e) { results.push({ name, ok: false, msg: e.message }); }
      }

      // 프레임 시퀀스를 흘려보낸다. jump 는 엣지라 횟수를, slide 는 유지 상태라
      // 프레임별 값을 본다 — 횟수로 세면 "얼마나 오래 유지됐나" 를 검증할 수 없다
      function feed(mapper, poses, startMs = 0, stepMs = 33) {
        let jumps = 0, lane = 1;
        const slideAt = [];
        poses.forEach((p, i) => {
          const s = mapper.update(p, startMs + i * stepMs);
          if (s.jump) jumps++;
          slideAt.push(s.slide);
          lane = s.lane;
        });
        return { jumps, slideAt, lane };
      }

      // 셀프 테스트는 InputMapper 의 로직(엣지·유지·불응기·스케일 무관성)을 검증한다.
      // 합성 포즈 값은 임계와의 관계로 의미가 정해지므로, 실측 튜닝이 DEFAULT_CFG 를
      // 바꿔도 그 관계가 흔들리지 않도록 임계를 못박는다
      const TEST_CFG = { jumpThreshold: 0.2, slideThreshold: 0.5, slideRelease: 0.7 };

      function calibrated(makeStand = () => makePose(), overrides) {
        const m = createInputMapper({ ...TEST_CFG, ...overrides });
        for (let i = 0; i < 30; i++) m.addCalibrationSample(makeStand());
        m.commitCalibration();
        return m;
      }

      const stand = () => makePose();

      check('점프 시퀀스에서 jump가 정확히 1회 발화한다', () => {
        // 눈 기준선 0.10, 몸통 0.25. 임계 0.2 → 0.05 위로 뜨면 발화한다
        const m = calibrated();
        const seq = [
          stand(), stand(), stand(),
          makePose({ eyeY: 0.06 }),   // 0.16 몸통 — 아직 아니다
          makePose({ eyeY: 0.03 }),   // 0.28 몸통 — 여기서 발화
          makePose({ eyeY: 0.04 }),   // 0.24 몸통 — 여전히 넘지만 새 엣지가 아니다
          stand(), stand(), stand(),
        ];
        const r = feed(m, seq);
        assert(r.jumps === 1, `jump ${r.jumps}회 발화 (기대 1)`);
      });

      // 기대 프레임열과 실제를 비교한다. 유지 상태는 "언제 켜지고 언제 꺼지나" 가 전부다
      const sameFrames = (got, want) =>
        got.length === want.length && got.every((v, i) => v === want[i]);
      const showFrames = (a) => a.map((v) => (v ? 'O' : '.')).join('');

      check('슬라이드는 숙이고 있는 동안 유지되고 몸을 세우면 풀린다', () => {
        // 눈 기준선 0.10, 몸통 0.25. 임계 0.5 → 0.125 아래로 숙이면 걸린다
        const m = calibrated();
        const r = feed(m, [
          stand(),
          makePose({ eyeY: 0.20 }),   // 0.40 몸통 — 아직 안 걸린다
          makePose({ eyeY: 0.26 }),   // 0.64 몸통 — 여기서 걸린다
          makePose({ eyeY: 0.30 }),   // 0.80 몸통 — 계속 숙이고 있다
          makePose({ eyeY: 0.26 }),   // 0.64 몸통 — 여전히 유지
          stand(),                    // 몸을 세웠다 — 여기서 풀린다
          stand(),
        ]);
        const want = [false, false, true, true, true, false, false];
        assert(sameFrames(r.slideAt, want),
          `프레임열 ${showFrames(r.slideAt)} (기대 ${showFrames(want)})`);
        assert(r.jumps === 0, `슬라이드인데 jump가 ${r.jumps}회 발화했다`);
      });

      check('걸린 뒤에는 거는 문턱 아래로 올라와도 푸는 문턱까지는 유지된다', () => {
        // 거는 문턱 0.5, 푸는 문턱 0.5 x 0.7 = 0.35 몸통.
        // 이 히스테리시스가 없으면 문턱 근처에서 떨 때 슬라이드가 깜빡인다
        const m = calibrated();
        const r = feed(m, [
          stand(),
          makePose({ eyeY: 0.26 }),   // 0.64 — 걸린다
          makePose({ eyeY: 0.22 }),   // 0.48 — 거는 문턱 아래지만 푸는 문턱 위 → 유지
          makePose({ eyeY: 0.18 }),   // 0.32 — 푸는 문턱 아래 → 풀린다
        ]);
        const want = [false, true, true, false];
        assert(sameFrames(r.slideAt, want),
          `프레임열 ${showFrames(r.slideAt)} (기대 ${showFrames(want)})`);
      });

      check('포즈를 놓친 프레임에도 슬라이드 자세는 유지된다', () => {
        // 한 프레임 놓쳤다고 자세를 풀면 마침 가로보가 지나갈 때 억울하게 죽는다
        const m = calibrated();
        const r = feed(m, [
          stand(),
          makePose({ eyeY: 0.26 }),   // 걸린다
          null,                       // 포즈 유실 — 붙들어야 한다
          null,
          makePose({ eyeY: 0.26 }),   // 다시 보인다
          stand(),                    // 세웠다 — 풀린다
        ]);
        const want = [false, true, true, true, true, false];
        assert(sameFrames(r.slideAt, want),
          `프레임열 ${showFrames(r.slideAt)} (기대 ${showFrames(want)})`);
      });

      check('불응기 안의 두 번째 점프는 무시된다', () => {
        const m = calibrated();
        const pulse = [makePose({ eyeY: 0.03 }), stand()];
        // 약 130ms 안에 두 번. 불응기 900ms 이므로 1회만 나와야 한다
        const r = feed(m, [stand(), ...pulse, ...pulse]);
        assert(r.jumps === 1, `jump ${r.jumps}회 발화 (기대 1)`);
      });

      check('레인 이동이 좌·중·우로 올바르게 판정된다', () => {
        // laneX = 1 - hipX 이므로 hipX 0.85 → laneX 0.15 → 왼쪽
        const left = feed(calibrated(), Array.from({ length: 30 }, () => makePose({ hipX: 0.85 })));
        assert(left.lane === 0, `왼쪽 기대 0, 실제 ${left.lane}`);
        const mid = feed(calibrated(), Array.from({ length: 30 }, () => makePose({ hipX: 0.50 })));
        assert(mid.lane === 1, `가운데 기대 1, 실제 ${mid.lane}`);
        const right = feed(calibrated(), Array.from({ length: 30 }, () => makePose({ hipX: 0.15 })));
        assert(right.lane === 2, `오른쪽 기대 2, 실제 ${right.lane}`);
      });

      check('경계에서 미세하게 흔들 때 레인이 떨리지 않는다', () => {
        const m = calibrated();
        feed(m, Array.from({ length: 20 }, () => stand()));   // 가운데서 안정
        let flips = 0;
        let prev = 1;
        for (let i = 0; i < 40; i++) {
          // hipX 0.595/0.605 → laneX 0.405/0.395. 경계 0.40 을 사이에 두고 진동한다
          const hipX = 0.595 + (i % 2) * 0.01;
          const s = m.update(makePose({ hipX }), 2000 + i * 33);
          if (s.lane !== prev) { flips++; prev = s.lane; }
        }
        assert(flips <= 1, `레인이 ${flips}회 바뀌었다 (기대 1회 이하)`);
      });

      check('앞뒤로 움직여 스케일이 변해도 판정이 유지된다', () => {
        // 멀리 선 사람 — 몸통 길이가 절반(0.125)이다. 같은 비율의 점프는 여전히 감지돼야 한다
        const far = (o = {}) =>
          makePose({ shoulderY: 0.40, hipY: 0.525, eyeY: 0.35, ...o });
        const m = calibrated(far);
        // 0.35 → 0.32 는 0.03/0.125 = 0.24 몸통. 가까이 있을 때와 같은 비율이다
        const r = feed(m, [far(), far({ eyeY: 0.32 }), far()]);
        assert(r.jumps === 1, `먼 거리에서 jump ${r.jumps}회 발화 (기대 1)`);
      });

      check('봉우리는 관측된 최대 상승량을 유지하고 캘리브레이션에서 리셋된다', () => {
        // 봉우리는 2~3 프레임짜리라 실시간 값으로는 읽을 수 없다. 그래서 붙든다
        const m = calibrated();
        feed(m, [stand(), makePose({ eyeY: 0.03 }), stand()]);   // 0.28 몸통
        const peak = m.getDebug().peakHeadRise;
        assert(Math.abs(peak - 0.28) < 1e-6, `봉우리 ${peak} (기대 0.28)`);

        // 더 낮은 점프가 뒤따라도 봉우리는 내려가지 않는다
        feed(m, [makePose({ eyeY: 0.06 }), stand()], 5000);      // 0.16 몸통
        const held = m.getDebug().peakHeadRise;
        assert(Math.abs(held - 0.28) < 1e-6, `봉우리가 ${held} 로 내려갔다 (기대 0.28 유지)`);

        // 기준선이 바뀌면 이전 봉우리는 의미가 없다
        for (let i = 0; i < 30; i++) m.addCalibrationSample(stand());
        m.commitCalibration();
        const reset = m.getDebug().peakHeadRise;
        assert(reset === 0, `캘리브레이션 후 봉우리 ${reset} (기대 0)`);
      });

      // 약 3초. 복구 시간 1500ms 에 점프 잠금 900ms 가 앞설 수 있어 넉넉히 준다
      const still = () => Array.from({ length: 90 }, stand);

      check('기준선이 점프 임계를 넘게 틀어져도 스스로 회복한다', () => {
        // 굽힌 채(눈 0.16) 기준을 잡고 똑바로 서면(눈 0.10) 오차가 0.24 몸통이다.
        // 임계 0.2 를 넘으므로 jumpOver 가 영구 참이 되어 새 엣지가 안 생기고,
        // 조용함 대역(0.1) 밖이라 그 오차를 지울 기준선 추종마저 꺼진다
        const m = calibrated(() => makePose({ eyeY: 0.16 }));
        feed(m, still());
        const residual = m.getDebug().headRise;
        assert(Math.abs(residual) < 1e-6, `3초를 서 있었는데 잔차 ${residual} (기대 0)`);

        const after = feed(m, [stand(), makePose({ eyeY: 0.03 }), stand()], 5000);
        assert(after.jumps === 1, `회복 후 jump ${after.jumps}회 발화 (기대 1)`);
      });

      check('기준선이 반대로 틀어져도 스스로 회복한다', () => {
        // 까치발(눈 0.06)로 기준을 잡고 평소대로 서면 오차가 -0.16 몸통이다.
        // 래치는 안 생기지만 점프가 그만큼 손해를 봐 임계를 못 넘는다 — 증상이 같다
        const m = calibrated(() => makePose({ eyeY: 0.06 }));
        feed(m, still());
        const residual = m.getDebug().headRise;
        assert(Math.abs(residual) < 1e-6, `3초를 서 있었는데 잔차 ${residual} (기대 0)`);

        const after = feed(m, [stand(), makePose({ eyeY: 0.03 }), stand()], 5000);
        assert(after.jumps === 1, `회복 후 jump ${after.jumps}회 발화 (기대 1)`);
      });

      check('슬라이드를 오래 유지해도 기준선이 그 자세로 굳지 않는다', () => {
        // 복구가 슬라이드를 기준선 오류로 오해하면 슬라이드 자세가 기준선이 되어
        // 슬라이드가 영영 안 먹는다. 판정 중에는 기준선을 건드리지 않아야 한다
        const m = calibrated();
        const r = feed(m, Array.from({ length: 150 }, () => makePose({ eyeY: 0.26 })));
        const held = r.slideAt.filter(Boolean).length;
        assert(held === 150, `5초 유지 중 ${held} 프레임만 슬라이드였다 (기대 150)`);

        // 굳었다면 일어서는 순간 머리가 기준선보다 0.64 몸통 위가 되어 헛점프가 난다
        const up = feed(m, [stand(), stand()], 6000);
        assert(up.jumps === 0, `일어섰더니 jump ${up.jumps}회 — 기준선이 슬라이드 자세로 굳었다`);
      });

      check('천천히 떠오르는 점프도 정상 발화한다', () => {
        // 상승 구간은 조용함 대역(0.1) 밖이지만 아직 임계(0.2) 아래라 판정 전이고,
        // 그래서 잠금도 없어 복구 타이머가 돈다. 복구 시간이 짧으면 뜨는 도중에
        // 기준선이 머리를 따라가 점프가 영영 임계를 못 넘는다
        const m = calibrated();
        const r = feed(m, [
          stand(),
          makePose({ eyeY: 0.074 }),   // 0.104 몸통 — 대역 밖으로 나간다
          makePose({ eyeY: 0.070 }),   // 0.120
          makePose({ eyeY: 0.066 }),   // 0.136
          makePose({ eyeY: 0.062 }),   // 0.152
          makePose({ eyeY: 0.058 }),   // 0.168 — 여기까지 165ms 를 대역 밖에 머문다
          makePose({ eyeY: 0.045 }),   // 0.220 — 여기서 발화해야 한다
          stand(),
        ]);
        assert(r.jumps === 1, `jump ${r.jumps}회 발화 (기대 1)`);
      });

      check('점프를 반복해도 기준선이 머리를 쫓아 올라가지 않는다', () => {
        // 조용함 대역이 있는 이유다. 없으면 점프할 때마다 기준선이 조금씩 따라
        // 올라가 점프가 점점 안 걸린다 — 예전에 실제로 났던 버그다
        const m = calibrated();
        let jumps = 0;
        for (let i = 0; i < 20; i++) {
          // 한 번에 30 프레임(990ms). 잠금 900ms 가 풀린 뒤 다음 점프가 온다
          const r = feed(m, [makePose({ eyeY: 0.03 }), ...Array.from({ length: 29 }, stand)], i * 30 * 33);
          jumps += r.jumps;
        }
        assert(jumps === 20, `점프 20회 중 ${jumps}회만 발화 — 기준선이 밀렸다`);
      });

      check('속도 게이지는 상한 없이 단계를 올린다', () => {
        // 예전엔 속도가 55에서 멈췄고, 그때 막대는 100%에 붙박여 거짓말을 했다.
        // 이제 상한이 없으니 막대는 매 단계 다시 비어야 하고 단계는 물러서면 안 된다
        const start = speedGauge(BASE_SPEED);
        assert(start.level === 1 && start.fill === 0, '출발은 1단계 빈 막대여야 한다');
        let prev = 0;
        for (let sp = BASE_SPEED; sp <= BASE_SPEED + 40 * SPEED_STEP; sp += 0.25) {
          const g = speedGauge(sp);
          assert(g.fill >= 0 && g.fill < 1, `속도 ${sp} 에서 막대가 범위를 벗어났다`);
          assert(g.level >= prev, `속도 ${sp} 에서 단계가 내려갔다`);
          prev = g.level;
        }
        assert(prev === 41, `40단계를 더 올라 41단계여야 하는데 ${prev}단계에서 멈췄다`);
      });

      check('코인 줄은 화면을 메우되 다음 무리 앞에서 끊긴다', () => {
        // 빈 구간을 코인으로 메우는 게 목적이지만, 마지막 코인을 먹고도 몸을 옮길
        // 시간이 남아야 한다. 간격은 속도에 비례하므로 "간격의 몇 할"이 곧 일정한 시간이다
        for (const gap of [BASE_GAP, 40, 60, MAX_GAP]) {
          const rng = mulberry32(3);
          for (let trial = 0; trial < 30; trial++) {
            const objs = spawnGroup(rng, Z_SPAWN, gap);
            const coins = objs.filter((o) => o.kind === 'coin');
            if (coins.length === 0) continue;   // 빈 레인이 없으면 코인도 없다

            const want = Math.ceil((gap * COIN_TRAIL) / COIN_SPACING);
            assert(coins.length === want, `간격 ${gap} 에서 코인 ${coins.length}개 — ${want}개여야 한다`);

            const last = Math.max(...coins.map((o) => o.z)) - Z_SPAWN;
            assert(gap - last > gap * 0.35,
              `간격 ${gap} 에서 마지막 코인이 다음 무리에 ${gap - last} 까지 붙었다`);

            const trapped = coins.some((c) =>
              objs.some((o) => o.kind !== 'coin' && o.lane === c.lane && o.z === c.z));
            assert(!trapped, `간격 ${gap} 에서 코인이 장애물과 같은 자리에 놓였다`);
          }
        }
      });

      // 정렬 판정은 준비 화면이 눈·골반 선에 몸을 맞추게 하는 규칙이다.
      // 선 위치는 실측으로 바뀔 수 있으니 임계처럼 못박고 관계만 검증한다
      const TEST_ALIGN = { eyeY: 0.22, hipY: 0.62, tol: 0.05 };
      const alignedAt = (eyeY, hipY) =>
        alignCheck(poseMetrics(makePose({ eyeY, hipY, shoulderY: (eyeY + hipY) / 2 })), TEST_ALIGN);

      check('눈과 골반이 둘 다 선 근처일 때만 정렬로 본다', () => {
        assert(alignedAt(0.22, 0.62).aligned, '정확히 선 위인데 정렬이 아니다');
        assert(alignedAt(0.26, 0.58).aligned, '허용 오차 안(0.04)인데 정렬이 아니다');
        assert(!alignedAt(0.22, 0.70).aligned, '골반만 0.08 벗어났는데 정렬로 봤다');
        assert(!alignedAt(0.10, 0.62).aligned, '눈만 0.12 벗어났는데 정렬로 봤다');
      });

      check('정렬이 안 되면 거리를 먼저, 그 다음 카메라 높이를 고치라고 한다', () => {
        // 눈-골반 간격이 목표 0.40 보다 좁으면 멀리 있는 것이고, 넓으면 가까운 것이다.
        // 간격이 맞는데 위아래로 치우쳤으면 몸이 아니라 카메라 각도 문제다
        assert(alignedAt(0.30, 0.54).hint === '앞으로 오세요', `간격 0.24 인데 힌트가 ${alignedAt(0.30, 0.54).hint}`);
        assert(alignedAt(0.12, 0.72).hint === '뒤로 물러나세요', `간격 0.60 인데 힌트가 ${alignedAt(0.12, 0.72).hint}`);
        assert(alignedAt(0.05, 0.45).hint === '카메라를 위로 기울이세요', `몸이 위로 치우쳤는데 힌트가 ${alignedAt(0.05, 0.45).hint}`);
        assert(alignedAt(0.40, 0.80).hint === '카메라를 아래로 기울이세요', `몸이 아래로 치우쳤는데 힌트가 ${alignedAt(0.40, 0.80).hint}`);
        assert(alignedAt(0.22, 0.62).hint === null, '정렬됐는데 힌트가 남았다');
      });

      check('졸라맨은 화면에 보이는 뼈만 그린다', () => {
        assert(visibleBones(withMidpoints(makePose())).length === BONES.length, '전부 보이는데 뼈가 빠졌다');
        // 앉아 있으면 무릎 아래는 화면 밖이라 추정치뿐이다. 그 뼈는 그리지 않는다
        const seated = makePose();
        for (let i = 25; i <= 32; i++) seated[i].visibility = 0.1;
        const bones = visibleBones(withMidpoints(seated));
        assert(bones.every(([a, b]) => !(a >= 25 && a <= 32) && !(b >= 25 && b <= 32)), '안 보이는 다리 뼈가 남았다');
        assert(bones.length === BONES.length - 6,
          `다리·발 뼈 6개가 빠져야 하는데 ${BONES.length - bones.length}개 빠졌다`);
      });

      check('어깨·골반 중점은 한쪽이라도 안 보이면 안 보이는 것으로 친다', () => {
        // 중점은 두 점의 평균이라, 한쪽이 화면 밖이면 그 평균도 믿을 수 없다
        const half = makePose();
        half[LM.HIP_R].visibility = 0.1;
        const pts = withMidpoints(half);
        assert(seen(pts[SHO_MID]), '어깨는 둘 다 보이는데 중점이 안 보인다고 한다');
        assert(!seen(pts[HIP_MID]), '오른쪽 골반이 안 보이는데 골반 중점을 보이는 것으로 쳤다');
        const bones = visibleBones(pts);
        assert(bones.every(([a, b]) => a !== HIP_MID && b !== HIP_MID), '골반 중점에 붙은 뼈가 남았다');
      });

      check('사라진 물체의 메시는 풀로 돌아가고 새 물체가 그것을 다시 쓴다', () => {
        // 몇 분을 달려도 메시 수가 늘기만 하면 안 된다. 동시에 보이는 수만큼만 만들어져야 한다
        const pool = { coin: [], pillar: [] };
        let made = 0;
        const acquire = (kind) => pool[kind].pop() ?? { id: made++, kind };
        const release = (kind, mesh) => pool[kind].push(mesh);
        const map = new Map();
        const a = { kind: 'coin' }, b = { kind: 'coin' }, p = { kind: 'pillar' };

        syncMeshes(map, [a, b, p], acquire, release);
        assert(map.size === 3 && made === 3, `물체 3개에 메시 ${map.size}개, 만든 수 ${made}`);

        syncMeshes(map, [b, p], acquire, release);
        assert(!map.has(a) && pool.coin.length === 1, '사라진 코인의 메시가 풀로 돌아가지 않았다');

        const c = { kind: 'coin' };
        syncMeshes(map, [b, p, c], acquire, release);
        assert(made === 3, `풀에 코인 메시가 있는데 새로 만들었다 (만든 수 ${made})`);
        assert(map.get(c).kind === 'coin', '종류가 다른 풀에서 메시를 꺼냈다');

        // 게임오버 뒤 시작 화면 — 이전 판 메시가 남아 보이면 안 된다
        syncMeshes(map, [], acquire, release);
        assert(map.size === 0 && pool.coin.length === 2 && pool.pillar.length === 1, '빈 목록인데 메시가 남았다');
      });

      return results;
    }

    function renderSelfTests(results) {
      const passed = results.filter((r) => r.ok).length;
      const rows = results
        .map((r) => `<li style="color:${r.ok ? '#7ef6a0' : '#ff6b6b'}">
          ${r.ok ? 'PASS' : 'FAIL'} — ${r.name}${r.msg ? `<br><small>${r.msg}</small>` : ''}
        </li>`)
        .join('');
      document.body.innerHTML = `
        <div style="padding:24px;font-family:system-ui;line-height:1.7">
          <h1>InputMapper 셀프 테스트</h1>
          <p style="font-size:20px">${passed} / ${results.length} 통과</p>
          <ul style="list-style:none;padding:0">${rows}</ul>
        </div>`;
    }
    // ── Game — 조작 신호만 받아 상태를 굴린다. 그리기는 아래 3D 렌더러가 한다. 포즈의 존재를 모른다
    const Z_SPAWN = 100;          // 소실점 z
    const Z_CHAR = 3;             // 캐릭터 z
    const Z_DESPAWN = -5;
    const BASE_SPEED = 18;        // z/초
    const SPEED_GROWTH = 0.35;    // 초당 증가
    const SPEED_STEP = 10;        // 이만큼 빨라질 때마다 속도 단계가 하나 오른다
    // 속도에는 상한이 없지만 어두워짐에는 있어야 한다. 계속 어두워지면 보고 피할 수가 없다
    const DARK_SPEED = 55;
    const BASE_GAP = 26;          // BASE_SPEED 기준 스폰 간격
    // 간격 천장. 보이는 트랙(Z_SPAWN-Z_CHAR=97)보다 벌어지면 무리가 하나도 없는 순간이 생긴다
    const MAX_GAP = 90;
    const COIN_SPACING = 10;      // 코인 줄에서 코인 사이 거리
    // 코인 줄이 간격의 몇 할까지 뻗는가. 남은 몫은 다음 무리를 읽고 몸을 옮기는 시간이다 —
    // 간격은 속도에 비례하니 이 비율은 곧 일정한 시간이 된다(0.3~0.6초)
    const COIN_TRAIL = 0.6;
    // InputMapper의 DEFAULT_CFG.animMs와 값을 맞춰야 한다 (위 "── InputMapper" 섹션)
    const JUMP_MS = 600;
    const COIN_VALUE = 10;

    // 속도에 상한이 없으니 막대 하나로는 표시할 수 없다. 한 단계를 채우면 다시 비우고,
    // 몇 바퀴째인지는 단계 숫자가 말한다
    function speedGauge(sp) {
      const over = sp - BASE_SPEED;
      return { level: Math.floor(over / SPEED_STEP) + 1, fill: (over % SPEED_STEP) / SPEED_STEP };
    }

    // ── 팔레트 — 위 CSS :root 와 같은 값이다. 한쪽만 바꾸면 화면이 갈라진다
    const C = {
      skyTop: '#05070f', skyMid: '#141033', skyHorizon: '#3a1d63',
      groundFar: '#161f42', groundMid: '#0b1128', groundNear: '#070a18',
      ink: '#eaf1ff', inkDim: '#98abd0',
      cyan: '#4de3ff', mint: '#7ef6a0', mintDark: '#3fbf74',
      gold: '#ffd34d', goldLight: '#fff2b8',
      ember: '#ff6a4d', emberLight: '#ffb199', emberDark: '#7a2418',
      violet: '#b06dff', violetDark: '#3b1a6b', violetLight: '#d8b4ff',
    };
    const DISPLAY_FONT = "'Black Han Sans', 'Apple SD Gothic Neo', system-ui, sans-serif";
    // 게임 물체와 3D 메시를 1:1 로 짝짓는다. 새 물체는 풀에서 메시를 받고, 사라진 물체의 메시는
    // 풀로 돌아간다. 프레임마다 메시를 새로 만들면 몇 분 뒤 GPU 메모리가 샌다
    function syncMeshes(map, objects, acquire, release) {
      const alive = new Set(objects);
      for (const [o, mesh] of map) {
        if (!alive.has(o)) {
          release(o.kind, mesh);
          map.delete(o);
        }
      }
      for (const o of objects) if (!map.has(o)) map.set(o, acquire(o.kind));
    }

    // 결정적 난수. 시드를 고정하면 같은 코스가 재현된다
    function mulberry32(seed) {
      let a = seed;
      return function () {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function clears(kind, isJumping, isSliding) {
      if (kind === 'barricade') return isJumping;
      if (kind === 'beam') return isSliding;
      return false;   // pillar — 레인을 바꾸는 수밖에 없다
    }

    // 게임은 항상 클리어 가능해야 한다.
    // 기둥을 최대 2개로 제한하면 최소 한 레인은 기둥이 아니게 되고,
    // 기둥 아닌 레인은 빈 레인이거나 점프/슬라이드로 통과 가능하다
    function spawnGroup(rng, atZ, gap) {
      const kinds = [null, null, null];
      const pillarCount = Math.floor(rng() * 3);   // 0, 1, 2
      const lanes = [0, 1, 2];
      for (let i = lanes.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [lanes[i], lanes[j]] = [lanes[j], lanes[i]];
      }
      for (let i = 0; i < pillarCount; i++) kinds[lanes[i]] = 'pillar';

      for (let l = 0; l < 3; l++) {
        if (kinds[l]) continue;
        const r = rng();
        if (r < 0.25) kinds[l] = 'barricade';
        else if (r < 0.45) kinds[l] = 'beam';
      }

      const objects = [];
      for (let l = 0; l < 3; l++) {
        if (kinds[l]) objects.push({ kind: kinds[l], lane: l, z: atZ, dead: false });
      }

      // 코인은 완전히 빈 레인에만 둔다. 플레이어를 함정으로 유인하지 않는다.
      // 빨라질수록 무리 사이가 벌어져 트랙이 한산해진다 — 그 사이를 코인 줄로 메운다.
      // 장애물을 촘촘히 놓아 메울 수는 없다. 몸으로 반응할 시간이 사라진다
      const emptyLanes = [0, 1, 2].filter((l) => !kinds[l]);
      if (emptyLanes.length > 0) {
        const l = emptyLanes[Math.floor(rng() * emptyLanes.length)];
        for (let k = 0; k * COIN_SPACING < gap * COIN_TRAIL; k++) {
          objects.push({ kind: 'coin', lane: l, z: atZ + k * COIN_SPACING, dead: false });
        }
      }
      return objects;
    }

    function createGame() {
      let state = 'idle';
      let lane = 1;
      let laneVisual = 1;
      let jumpEndMs = 0;
      let sliding = false;
      let speed = BASE_SPEED;
      let distance = 0;
      let coins = 0;
      let elapsed = 0;
      let objects = [];
      let zSinceSpawn = 0;
      let lastMs = 0;
      let rng = mulberry32(1);
      let nowMs = 0;

      function reset(seed = 1, startMs = 0) {
        state = 'playing';
        lane = 1; laneVisual = 1;
        jumpEndMs = 0; sliding = false;
        speed = BASE_SPEED; distance = 0; coins = 0; elapsed = 0;
        objects = []; zSinceSpawn = 0;
        lastMs = startMs; nowMs = startMs;
        rng = mulberry32(seed);
      }

      function step(signal, atMs) {
        if (state !== 'playing') return;
        nowMs = atMs;
        // 탭 전환 후 델타가 폭발해 장애물을 관통하는 것을 막는다
        const dt = Math.min((atMs - lastMs) / 1000, 0.05);
        lastMs = atMs;
        if (dt <= 0) return;

        elapsed += dt;
        speed = BASE_SPEED + SPEED_GROWTH * elapsed;
        distance += speed * dt;

        lane = signal.lane;
        // 점프는 탄도라 한 번 뜨면 JUMP_MS 동안 내려올 수 없다.
        // 슬라이드는 자세라 신호가 들어와 있는 동안만 유지된다 — 타이머가 없다
        if (signal.jump && atMs >= jumpEndMs && !signal.slide) jumpEndMs = atMs + JUMP_MS;
        const isJumping = atMs < jumpEndMs;
        const isSliding = signal.slide && !isJumping;
        sliding = isSliding;   // 렌더는 step 뒤에 돌고 signal 을 못 본다

        laneVisual += (lane - laneVisual) * Math.min(1, dt * 12);

        // 속도가 오르면 간격도 벌려 반응 시간을 지킨다. 단 MAX_GAP 까지다 —
        // 그 위로 벌리면 반응 시간은 남지만 트랙이 텅 빈다
        zSinceSpawn += speed * dt;
        const gap = Math.min(BASE_GAP * (speed / BASE_SPEED), MAX_GAP);
        if (zSinceSpawn >= gap) {
          objects.push(...spawnGroup(rng, Z_SPAWN, gap));
          zSinceSpawn = 0;
        }

        for (const o of objects) {
          const prevZ = o.z;
          o.z -= speed * dt;
          // 교차 판정이라 속도가 아무리 올라도 관통하지 않는다
          if (prevZ > Z_CHAR && o.z <= Z_CHAR && o.lane === lane) {
            if (o.kind === 'coin') {
              coins += 1;
              o.dead = true;
            } else if (!clears(o.kind, isJumping, isSliding)) {
              state = 'over';
              return;
            }
          }
        }
        objects = objects.filter((o) => !o.dead && o.z > Z_DESPAWN);
      }

      const getScore = () => Math.floor(distance) + coins * COIN_VALUE;

      // 그리는 쪽이 필요한 값을 한 번에 넘긴다. 그리는 쪽은 상태를 바꾸지 않는다
      function view() {
        return {
          objects, laneVisual, sliding, distance, speed, coins, nowMs,
          jumpT: nowMs < jumpEndMs ? 1 - (jumpEndMs - nowMs) / JUMP_MS : null,
          score: getScore(),
        };
      }

      return { reset, step, view, getState: () => state, getScore };
    }

    // ── 점수판 — 3D 위에 얹은 #hud 캔버스에 그린다
    function drawHud(ctx, v) {
      const pad = 28;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';

      const score = String(v.score);
      ctx.font = `400 46px ${DISPLAY_FONT}`;
      const scoreW = ctx.measureText(score).width;
      ctx.fillStyle = C.ink;
      ctx.fillText(score, pad, pad + 40);
      ctx.fillStyle = C.inkDim;
      ctx.font = '600 16px system-ui, sans-serif';
      ctx.fillText('점', pad + scoreW + 7, pad + 40);

      // 속도 게이지 — 막대는 한 단계분, 숫자는 몇 단계인지
      const barY = pad + 56;
      const gauge = speedGauge(v.speed);
      ctx.fillStyle = 'rgba(125, 214, 255, 0.16)';
      ctx.fillRect(pad, barY, 132, 3);
      ctx.fillStyle = C.cyan;
      ctx.fillRect(pad, barY, 132 * gauge.fill, 3);

      ctx.textBaseline = 'middle';
      ctx.font = '600 14px system-ui, sans-serif';
      ctx.fillText(`${gauge.level}단계`, pad + 142, barY + 2);

      // 코인 — 아이콘도 같은 금화다. 화면 안의 것과 같은 것임이 보여야 한다
      const cy = barY + 24;
      ctx.fillStyle = C.gold;
      ctx.beginPath();
      ctx.arc(pad + 6, cy, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = C.inkDim;
      ctx.font = '600 15px system-ui, sans-serif';
      ctx.fillText(String(v.coins), pad + 18, cy + 1);
      ctx.textBaseline = 'alphabetic';
    }

    // 빨라질수록 시야가 좁아진다. 그라디언트는 크기가 바뀔 때만 다시 만든다
    let vignetteCache = { key: '' };
    function drawVignette(ctx, W, H, strength) {
      const key = `${W}x${H}`;
      if (vignetteCache.key !== key) {
        const g = ctx.createRadialGradient(
          W / 2, H * 0.56, Math.min(W, H) * 0.28,
          W / 2, H * 0.56, Math.max(W, H) * 0.78
        );
        g.addColorStop(0, 'rgba(3, 5, 14, 0)');
        g.addColorStop(1, 'rgba(3, 5, 14, 0.75)');
        vignetteCache = { key, g };
      }
      ctx.globalAlpha = strength;
      ctx.fillStyle = vignetteCache.g;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    // ── 3D 렌더러 — view() 값을 받아 Three.js 장면으로 그린다. 게임 상태를 바꾸지 않는다.
    // 세계 단위: 게임 z 1 = 1. 게임 z 는 멀수록 크고 카메라는 -z 를 보므로 세계 z = -게임 z
    const LANE_W = 2.4;       // 레인 간격
    const RUNNER_H = 1.8;     // 러너 키. 장애물 높이는 이것과 판정의 관계로 정했다 (설계 문서 표)
    const JUMP_H = 2.2;       // 점프 꼭대기 발 높이. 바리케이드(1.1)를 확실히 넘어 보여야 한다
    const GRID = 7;           // 바닥 격자 한 칸
    // 발광 효과는 GPU 를 먹는다. 포즈 추적과 같이 돌려 느리면 ?bloom=0 으로 끈다
    const BLOOM = new URLSearchParams(location.search).get('bloom') !== '0';

    const laneX = (lane) => (lane - 1) * LANE_W;

    function skyTexture(THREE) {
      const c = document.createElement('canvas');
      c.width = 2;
      c.height = 256;
      const g = c.getContext('2d');
      const grad = g.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0, C.skyTop);
      grad.addColorStop(0.4, C.skyMid);
      grad.addColorStop(0.6, C.skyHorizon);
      grad.addColorStop(1, C.skyHorizon);
      g.fillStyle = grad;
      g.fillRect(0, 0, 2, 256);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }

    function createRenderer3D(THREE, addons, canvas) {
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));

      const scene = new THREE.Scene();
      scene.background = skyTexture(THREE);
      // 스폰 지점(100)이 안개 속이다. 장애물이 멀리서 갑자기 튀어나오지 않고 서서히 드러난다
      scene.fog = new THREE.Fog(C.skyHorizon, 30, 95);

      const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 250);

      // 빛은 두 개뿐이다. 위는 보라, 아래는 청록 — 네온 도시의 반사광
      scene.add(new THREE.HemisphereLight(0x8f7dff, 0x1a4a6a, 1.6));
      const sun = new THREE.DirectionalLight(0xffffff, 1.4);
      sun.position.set(3, 8, 6);
      scene.add(sun);

      // 바닥 — 카메라 앞 20 부터 뒤로 220 까지
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(400, 240),
        new THREE.MeshStandardMaterial({ color: C.groundMid, roughness: 0.95 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.z = -100;
      scene.add(floor);

      // 달리는 면을 살짝 밝혀 '바닥' 이 아니라 '길' 로 읽히게 한다
      const track = new THREE.Mesh(
        new THREE.PlaneGeometry(LANE_W * 3, 240),
        new THREE.MeshBasicMaterial({ color: C.cyan, transparent: true, opacity: 0.05, depthWrite: false })
      );
      track.rotation.x = -Math.PI / 2;
      track.position.set(0, 0.003, -100);
      scene.add(track);

      // 격자 — 세계가 흐르고 있다는 증거. 한 칸만큼만 움직였다 되돌아가면 끝없이 흐르는 것처럼 보인다
      const grid = new THREE.GridHelper(GRID * 34, 34, 0x2a6f9c, 0x1d4f7a);
      grid.material.transparent = true;
      grid.material.opacity = 0.55;
      grid.position.y = 0.006;
      scene.add(grid);

      // 레인 경계 4줄. 바깥은 밝고 굵게, 안쪽은 흐리게 (2D 때와 같은 규칙)
      for (const edge of [-0.5, 0.5, 1.5, 2.5]) {
        const outer = edge === -0.5 || edge === 2.5;
        const line = new THREE.Mesh(
          new THREE.BoxGeometry(outer ? 0.09 : 0.045, 0.02, 240),
          new THREE.MeshBasicMaterial({ color: C.cyan, transparent: !outer, opacity: outer ? 1 : 0.35 })
        );
        line.position.set(laneX(edge), 0.01, -100);
        scene.add(line);
      }

      // 상자 하나를 늘려 여러 모양으로 쓴다 (장애물·빌딩 공용)
      const unitBox = new THREE.BoxGeometry(1, 1, 1);
      const unitEdges = new THREE.EdgesGeometry(unitBox);

      // 네온 도시 — 트랙 양옆 빌딩. 모양은 고정 시드로 한 번만 정하고 z 만 흘린다.
      // 카메라 뒤로 지나간 빌딩은 안개 너머(-200)로 돌아간다. 거기는 이미 안개 색이라 튀어나오지 않는다
      const CITY_SPAN = 210;
      const city = (() => {
        const rng = mulberry32(7);
        const winMat = new THREE.MeshStandardMaterial({ color: '#160e36', roughness: 0.8 });
        const edgeMats = [new THREE.LineBasicMaterial({ color: C.violet }), new THREE.LineBasicMaterial({ color: C.cyan })];
        const out = [];
        for (const side of [-1, 1]) {
          for (let z0 = 0; z0 < CITY_SPAN; z0 += 9 + rng() * 6) {
            const w = 3 + rng() * 4, h = 6 + rng() * 24, d = 4 + rng() * 5;
            const g = new THREE.Group();
            const body = new THREE.Mesh(unitBox, winMat);
            const edges = new THREE.LineSegments(unitEdges, edgeMats[out.length % 2]);
            body.scale.set(w, h, d);
            edges.scale.set(w, h, d);
            g.add(body, edges);
            g.position.set(side * (LANE_W * 1.5 + 7 + w / 2 + rng() * 6), h / 2, 0);
            scene.add(g);
            out.push({ g, z0 });
          }
        }
        return out;
      })();

      let composer = null;
      if (BLOOM) {
        composer = new addons.EffectComposer(renderer);
        composer.addPass(new addons.RenderPass(scene, camera));
        // 문턱 0.55 — 발광 재질과 밝은 선만 번진다. 어두운 바닥·하늘은 그대로
        composer.addPass(new addons.UnrealBloomPass(new THREE.Vector2(256, 256), 0.9, 0.5, 0.55));
        composer.addPass(new addons.OutputPass());
      }

      // ── 장애물 — 지오메트리와 재질은 종류마다 하나씩만 만들어 공유한다. 새로 만드는 건 껍데기뿐이다
      const lit = (color, glow = 0, extra = {}) => new THREE.MeshStandardMaterial({
        color, emissive: color, emissiveIntensity: glow, roughness: 0.55, metalness: 0.1, ...extra,
      });
      const glowLine = (color) => new THREE.LineBasicMaterial({ color });

      // 바리케이드 경고 줄무늬. 줄무늬 자체가 빛나야 어두운 트랙에서 읽힌다
      const stripes = (() => {
        const c = document.createElement('canvas');
        c.width = 128;
        c.height = 64;
        const g = c.getContext('2d');
        g.fillStyle = C.emberDark;
        g.fillRect(0, 0, 128, 64);
        g.fillStyle = C.ember;
        for (let x = -64; x < 128; x += 32) {
          g.beginPath();
          g.moveTo(x, 64); g.lineTo(x + 16, 64); g.lineTo(x + 80, 0); g.lineTo(x + 64, 0);
          g.closePath();
          g.fill();
        }
        const t = new THREE.CanvasTexture(c);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      })();

      const shadowGeo = new THREE.CircleGeometry(1, 24);
      const shadowMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.4, depthWrite: false });
      const M = {
        gold: lit(C.gold, 0.7, { metalness: 0.6, roughness: 0.3 }),
        stripes: new THREE.MeshStandardMaterial({ map: stripes, emissiveMap: stripes, emissive: 0xffffff, emissiveIntensity: 0.45 }),
        emberTop: new THREE.MeshBasicMaterial({ color: C.emberLight }),
        beam: lit('#0f4a6e', 0.15),
        beamPost: lit('#0f2a44'),
        cyan: new THREE.MeshBasicMaterial({ color: C.cyan }),
        pillar: lit(C.violetDark, 0.35),
        violet: glowLine(C.violet),
      };
      const coinGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.08, 28);

      function box(mat, w, h, d, x, y) {
        const m = new THREE.Mesh(unitBox, mat);
        m.scale.set(w, h, d);
        m.position.set(x, y, 0);
        return m;
      }

      // 바닥 그림자 — 물체가 땅에 붙어 있다는 가장 싼 단서다
      function shadow(rx, rz) {
        const m = new THREE.Mesh(shadowGeo, shadowMat);
        m.rotation.x = -Math.PI / 2;
        m.scale.set(rx, rz, 1);
        m.position.y = 0.012;
        return m;
      }

      // 치수는 설계 문서 표 그대로. 높이는 판정(점프·슬라이드)과의 관계로 정했다
      const BUILD = {
        coin() {
          const g = new THREE.Group();
          const disc = new THREE.Mesh(coinGeo, M.gold);
          disc.rotation.x = Math.PI / 2;   // 납작한 면이 카메라를 본다
          disc.position.y = 1.5;
          // 떠 있는 금화는 그림자가 없으면 어느 레인 위에 있는지 헷갈린다
          g.add(shadow(0.3, 0.3), disc);
          return g;
        },
        // 점프 꼭대기(2.2)보다 한참 낮다 — '뛰어넘는다' 로 읽혀야 한다
        barricade() {
          const g = new THREE.Group();
          g.add(shadow(1.1, 0.4), box(M.stripes, 1.7, 1.1, 0.35, 0, 0.55), box(M.emberTop, 1.72, 0.06, 0.37, 0, 1.13));
          return g;
        },
        // 아래 끝 1.2 — 선 키(1.8)보다 낮고 슬라이드 높이(약 0.7)보다 높다. 그 틈을 청록으로 밝힌다
        beam() {
          const g = new THREE.Group();
          g.add(
            shadow(1.0, 0.3),
            box(M.beam, 1.7, 0.75, 0.3, 0, 1.2 + 0.375),
            box(M.cyan, 1.7, 0.08, 0.32, 0, 1.24),
            box(M.beamPost, 0.08, 1.95, 0.08, -0.85, 0.975),
            box(M.beamPost, 0.08, 1.95, 0.08, 0.85, 0.975),
          );
          return g;
        },
        // 넘을 수도 숙일 수도 없다. 가장 높고 모서리가 빛난다
        pillar() {
          const g = new THREE.Group();
          const edges = new THREE.LineSegments(unitEdges, M.violet);
          edges.scale.set(0.86, 4.01, 0.86);
          edges.position.y = 2;
          g.add(shadow(0.75, 0.5), box(M.pillar, 0.85, 4, 0.85, 0, 2), edges);
          return g;
        },
      };

      const meshes = new Map();
      const pools = { coin: [], barricade: [], beam: [], pillar: [] };
      function acquire(kind) {
        let g = pools[kind].pop();
        if (!g) {
          g = BUILD[kind]();
          scene.add(g);
        }
        g.visible = true;
        return g;
      }
      function release(kind, g) {
        g.visible = false;
        pools[kind].push(g);
      }

      // ── 러너 — 뒤에서 본다. 팔다리는 관절(Group)에 매단 캡슐이라 관절을 돌리면 휘두른다.
      // 모든 치수는 발밑이 원점, 키 RUNNER_H 기준
      const runner = (() => {
        const skin = lit(C.mint, 0.1, { roughness: 0.4 });
        const shade = lit(C.mintDark, 0.08, { roughness: 0.4 });
        const root = new THREE.Group();   // 발밑. 슬라이드는 이것을 뒤로 눕힌다
        const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 0.45, 6, 12), skin);
        torso.position.y = 1.15;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 20, 14), skin);
        head.position.y = RUNNER_H - 0.2;
        root.add(torso, head);
        // 관절에서 아래로 매단다. 관절을 +x 로 돌리면 끝이 앞(-z)으로 간다
        function limb(x, y, len, r, mat) {
          const joint = new THREE.Group();
          joint.position.set(x, y, 0);
          const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, len - 2 * r, 4, 10), mat);
          m.position.y = -len / 2;
          joint.add(m);
          root.add(joint);
          return joint;
        }
        const legL = limb(-0.12, 0.8, 0.8, 0.1, shade);
        const legR = limb(0.12, 0.8, 0.8, 0.1, skin);
        const armL = limb(-0.3, 1.45, 0.65, 0.07, shade);
        const armR = limb(0.3, 1.45, 0.65, 0.07, skin);
        // 뜰수록 작고 흐려진다. 얼마나 높이 떠 있는지 읽는 유일한 단서다
        const blob = new THREE.Mesh(shadowGeo, shadowMat.clone());
        blob.rotation.x = -Math.PI / 2;
        blob.position.y = 0.012;
        scene.add(root, blob);
        return { root, legL, legR, armL, armR, blob };
      })();

      const SLIDE_TILT = 1.2;   // 약 70°. 머리가 0.8 아래로 내려와 빔(아래 끝 1.2) 밑을 지나가 보인다

      function poseRunner(v) {
        const r = runner;
        const x = laneX(v.laneVisual);
        let y = 0;
        if (v.jumpT !== null) {
          y = Math.sin(v.jumpT * Math.PI) * JUMP_H;
          r.legL.rotation.x = r.legR.rotation.x = 0.9;   // 다리를 앞으로 접는다
          r.armL.rotation.x = r.armR.rotation.x = 2.6;   // 팔을 머리 위로
          r.root.rotation.x = 0;
        } else if (v.sliding) {
          // 몸이 뒤로 누우면 다리는 저절로 앞을 향한다
          r.legL.rotation.x = r.legR.rotation.x = 0;
          r.armL.rotation.x = r.armR.rotation.x = 0.6;
          r.root.rotation.x = SLIDE_TILT;
        } else {
          // 달리기 위상은 이동 거리로 돌린다. 빨라지면 발도 저절로 빨라진다
          const s = Math.sin(v.distance * 0.55);
          r.legL.rotation.x = s * 0.8;
          r.legR.rotation.x = -s * 0.8;
          r.armL.rotation.x = -s * 0.7;
          r.armR.rotation.x = s * 0.7;
          r.root.rotation.x = 0;
        }
        r.root.position.set(x, y, -Z_CHAR);
        const near = 1 - Math.min(y / (JUMP_H * 1.2), 0.62);
        r.blob.position.set(x, 0.012, -Z_CHAR);
        r.blob.scale.set(0.55 * near, 0.35 * near, 1);
        r.blob.material.opacity = 0.45 * near;
      }

      let size = '';
      function resize(W, H) {
        const key = `${W}x${H}`;
        if (key === size) return;
        size = key;
        renderer.setSize(W, H, false);   // CSS 크기는 스타일시트가 정한다
        composer?.setSize(W, H);
        camera.aspect = W / H;
        camera.updateProjectionMatrix();
      }

      function scroll(dist) {
        grid.position.z = -100 + (dist % GRID);
        for (const b of city) b.g.position.z = -200 + (((b.z0 + dist) % CITY_SPAN) + CITY_SPAN) % CITY_SPAN;
      }

      // 러너 등 뒤 위. 레인을 옮기면 카메라는 절반만 따라간다 — 다 따라가면 옮긴 느낌이 안 난다
      function aim(laneVisual) {
        const x = laneX(laneVisual) * 0.5;
        camera.position.set(x, 3.4, -Z_CHAR + 6.5);
        camera.lookAt(x, 1.0, -Z_CHAR - 14);
      }

      function draw() {
        if (composer) composer.render();
        else renderer.render(scene, camera);
      }

      function render(v, W, H) {
        resize(W, H);
        scroll(v.distance);
        syncMeshes(meshes, v.objects, acquire, release);
        for (const [o, g] of meshes) {
          g.position.set(laneX(o.lane), 0, -o.z);
          // 돌아가는 금화 — 레인마다 위상을 달리해 줄이 한 덩어리로 돌지 않게 한다
          if (o.kind === 'coin') g.rotation.y = v.nowMs / 320 + o.lane * 1.7;
        }
        runner.root.visible = runner.blob.visible = true;
        poseRunner(v);
        aim(v.laneVisual);
        draw();
      }

      // 메뉴 뒤에서도 세계는 흐른다. 장애물도 러너도 없다
      function renderIdle(atMs, W, H) {
        resize(W, H);
        scroll(atMs * 0.006);
        syncMeshes(meshes, [], acquire, release);
        runner.root.visible = runner.blob.visible = false;
        aim(1);
        draw();
      }

      return { render, renderIdle };
    }

    // ── 키보드 소스 — 개발 편의가 아니라 필수 인프라다.
    // 게임 로직을 고칠 때마다 2m 뒤로 물러나 뛸 수는 없다.
    // InputMapper 와 신호 모양이 같아야 한다. jump 는 한 프레임짜리 엣지고,
    // slide 는 유지 상태다 — 몸을 숙이고 있는 것이 ArrowDown 을 누르고 있는 것에 대응한다
    function createKeyboardSource() {
      let lane = 1;
      let jump = false;
      let slide = false;

      const typing = (t) =>
        t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);

      window.addEventListener('keydown', (e) => {
        if (typing(e.target)) return;
        if (e.repeat) return;
        if (e.key === 'ArrowLeft') lane = Math.max(0, lane - 1);
        else if (e.key === 'ArrowRight') lane = Math.min(2, lane + 1);
        else if (e.key === 'ArrowUp' || e.key === ' ') jump = true;
        else if (e.key === 'ArrowDown') slide = true;
        else return;
        e.preventDefault();
      });

      // 키를 뗄 때까지 슬라이드가 유지된다. 입력창 가드를 걸지 않는다 —
      // 누를 때 걸렀으면 뗄 때는 무조건 풀어야 키가 눌린 채로 굳지 않는다
      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowDown') slide = false;
      });

      return {
        read() {
          const signal = { lane, jump, slide, warning: null };
          jump = false;   // 엣지라 읽으면 소비된다. slide 는 상태라 그대로 둔다
          return signal;
        },
        reset() { lane = 1; jump = false; slide = false; },
      };
    }
    // ── PoseTracker — 카메라를 열고 랜드마크를 내보낸다. 게임의 존재를 모른다
    const MP_VERSION = '0.10.35';
    const MP_MODULE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VERSION}`;
    const MP_WASM = `${MP_MODULE}/wasm`;
    const MP_MODEL =
      'https://storage.googleapis.com/mediapipe-models/pose_landmarker/' +
      'pose_landmarker_lite/float16/latest/pose_landmarker_lite.task';

    function createPoseTracker() {
      let landmarker = null;
      let video = null;
      let lastVideoTime = -1;
      let lastLandmarks = null;

      async function loadLandmarker() {
        // UMD 빌드가 없어 ESM 동적 import 만 가능하다.
        // 정적 import 로 하면 CDN 실패 시 이 모듈 전체가 죽어 키보드 폴백까지 사라진다
        const mp = await import(MP_MODULE);
        const fileset = await mp.FilesetResolver.forVisionTasks(MP_WASM);
        return mp.PoseLandmarker.createFromOptions(fileset, {
          baseOptions: { modelAssetPath: MP_MODEL, delegate: 'GPU' },
          runningMode: 'VIDEO',
          numPoses: 1,
          minPoseDetectionConfidence: 0.5,
          minPosePresenceConfidence: 0.5,
          minTrackingConfidence: 0.5,
        });
      }

      async function start(videoEl) {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 },
          audio: false,
        });
        try {
          videoEl.srcObject = stream;
          await videoEl.play();
          landmarker = await loadLandmarker();
          video = videoEl;
        } catch (e) {
          // MediaPipe 가 죽어도 카메라는 꺼야 한다. 안 그러면 목적 없이 표시등만 켜져 있다
          stream.getTracks().forEach((track) => track.stop());
          videoEl.srcObject = null;
          video = null;
          landmarker = null;
          throw e;
        }
      }

      function read(nowMs) {
        if (!landmarker || !video || video.readyState < 2) return null;
        // detectForVideo 는 메인 스레드를 막는다. 새 프레임일 때만 부른다
        if (video.currentTime === lastVideoTime) return lastLandmarks;
        lastVideoTime = video.currentTime;
        // 타임스탬프는 필수다. 문서의 detectForVideo(video) 예제는 동작하지 않는다
        const result = landmarker.detectForVideo(video, nowMs);
        lastLandmarks =
          result.landmarks && result.landmarks.length > 0 ? result.landmarks[0] : null;
        return lastLandmarks;
      }

      return { start, read };
    }
    // ── 디버그 패널 — 임계값은 몸으로 해보기 전에는 맞을 수 없다
    const TUNABLES = [
      { key: 'jumpThreshold', label: '점프 임계', min: 0.02, max: 0.6, step: 0.01 },
      { key: 'slideThreshold', label: '슬라이드 임계', min: 0.1, max: 1.0, step: 0.01 },
      { key: 'baselineAlpha', label: '기준선 EMA', min: 0.0, max: 0.2, step: 0.005 },
      { key: 'laneAlpha', label: '레인 EMA', min: 0.05, max: 1.0, step: 0.05 },
    ];

    function mountDebugPanel(mapper) {
      const root = document.getElementById('debug');
      root.classList.remove('hidden');
      root.innerHTML = `
        <h3>디버그 (D 키로 토글)</h3>
        <div class="row"><span>머리 높이</span><span id="d-head">-</span></div>
        <div class="row"><span>점프 봉우리</span><span id="d-peak">-</span></div>
        <div class="row"><span>laneX</span><span id="d-lanex">-</span></div>
        <div class="row"><span>확정 레인</span><span id="d-lane">-</span></div>
        <div class="row"><span>모드</span><span id="d-mode">-</span></div>
        ${TUNABLES.map((t) => `
          <label>${t.label} <span id="v-${t.key}">${mapper.cfg[t.key]}</span>
            <input type="range" id="s-${t.key}" min="${t.min}" max="${t.max}"
                   step="${t.step}" value="${mapper.cfg[t.key]}" />
          </label>`).join('')}
      `;

      for (const t of TUNABLES) {
        const slider = root.querySelector(`#s-${t.key}`);
        const readout = root.querySelector(`#v-${t.key}`);
        slider.addEventListener('input', () => {
          const value = parseFloat(slider.value);
          mapper.cfg[t.key] = value;   // cfg 는 mapper 내부가 참조하는 바로 그 객체다
          readout.textContent = value;
        });
      }

      const el = (id) => root.querySelector(id);
      window.addEventListener('keydown', (e) => {
        const t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
        if (e.key === 'd' || e.key === 'D') root.classList.toggle('hidden');
      });

      return {
        isVisible: () => !root.classList.contains('hidden'),
        update(debug, lane, mode) {
          if (root.classList.contains('hidden')) return;
          el('#d-head').textContent = debug.headRise.toFixed(3);
          el('#d-peak').textContent = debug.peakHeadRise.toFixed(3);
          el('#d-lanex').textContent = debug.laneX.toFixed(3);
          el('#d-lane').textContent = lane;
          el('#d-mode').textContent = mode;
        },
      };
    }
    // ── 프리뷰 오버레이 — 임계선을 몸 위에 직접 겹친다. 숫자보다 몸이 먼저 안다
    function createPreviewOverlay(canvasEl, cfg) {
      const ctx = canvasEl.getContext('2d');
      let w = 0;
      let h = 0;

      // 숨어 있는 동안에는 rect 가 0 이라 크기를 못 잡는다. 그래서 보일 때 늦게 잡는다
      function fit() {
        const rect = canvasEl.getBoundingClientRect();
        if (rect.width === 0) return false;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = rect.width;
        h = rect.height;
        canvasEl.width = Math.floor(w * dpr);
        canvasEl.height = Math.floor(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // 백킹 스토어만 키우면 선이 절반 크기로 그려진다
        return true;
      }

      // 두 가로선이 붙어 있으면 라벨이 겹친다. 문턱 간격은 slideRelease 와 몸통 길이에
      // 따라 얼마든지 좁아지므로, 겹칠 수 있는 짝은 라벨을 반대쪽 끝에 둔다
      function hline(yNorm, color, label, dash = [], side = 'left', width = 1.5) {
        const y = yNorm * h;
        ctx.save();
        ctx.setLineDash(dash);
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
        ctx.restore();
        if (label) {
          ctx.fillStyle = color;
          ctx.textAlign = side;
          ctx.fillText(label, side === 'left' ? 4 : w - 4, y - 3);
          ctx.textAlign = 'left';
        }
      }

      function vline(xNorm, color, dash) {
        ctx.save();
        ctx.setLineDash(dash);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(xNorm * w, 0);
        ctx.lineTo(xNorm * w, h);
        ctx.stroke();
        ctx.restore();
      }

      // 큰 미리보기 위의 라벨. 천장·벽 같은 밝은 배경 위에서도 읽히게 어두운 바탕을 깐다
      function tag(text, yNorm, color) {
        ctx.save();
        ctx.font = 'bold 15px system-ui, sans-serif';
        ctx.textBaseline = 'middle';
        const pad = 6, th = 22;
        const tw = ctx.measureText(text).width;
        const y = yNorm * h - th - 4;
        ctx.fillStyle = 'rgba(5, 7, 15, 0.75)';
        ctx.fillRect(8, y, tw + pad * 2, th);
        ctx.fillStyle = color;
        ctx.fillText(text, 8 + pad, y + th / 2);
        ctx.restore();
      }

      function clear() {
        if (w) ctx.clearRect(0, 0, w, h);
      }

      // 준비 화면의 정렬 안내 — 눈·골반 목표선과 허용 띠
      function guide(color) {
        ctx.save();
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = color;
        ctx.fillRect(0, (ALIGN.eyeY - ALIGN.tol) * h, w, 2 * ALIGN.tol * h);
        ctx.fillRect(0, (ALIGN.hipY - ALIGN.tol) * h, w, 2 * ALIGN.tol * h);
        ctx.restore();
        hline(ALIGN.eyeY, color, null, [], 'left', 2.5);
        hline(ALIGN.hipY, color, null, [], 'left', 2.5);
        tag('눈', ALIGN.eyeY, color);
        tag('골반', ALIGN.hipY, color);
      }

      // 졸라맨. 미리보기는 거울이어야 하니(사용자의 왼쪽 = 화면의 왼쪽) x 는 1 - x 로 그린다
      function skeleton(lm, accent) {
        const pts = withMidpoints(lm);
        const px = (p) => [(1 - p.x) * w, p.y * h];
        const r = Math.max(2.5, w * 0.007);
        ctx.save();
        ctx.strokeStyle = '#e8eeff';
        ctx.lineWidth = Math.max(1.5, w * 0.005);
        ctx.lineCap = 'round';
        ctx.beginPath();
        for (const [a, b] of visibleBones(pts)) {
          ctx.moveTo(...px(pts[a]));
          ctx.lineTo(...px(pts[b]));
        }
        // 머리 — 귀 사이 중점에 동그라미, 어깨 중점에서 올라가는 목선
        if ([7, 8, SHO_MID].every((i) => seen(pts[i]))) {
          const [lx, ly] = px(pts[7]), [rx, ry] = px(pts[8]);
          const hx = (lx + rx) / 2, hy = (ly + ry) / 2;
          const hr = Math.max(r * 2, Math.hypot(rx - lx, ry - ly) * 0.7);
          const [sx, sy] = px(pts[SHO_MID]);
          ctx.moveTo(sx, sy);
          ctx.lineTo(hx, hy + hr);
          ctx.moveTo(hx + hr, hy);
          ctx.arc(hx, hy, hr, 0, Math.PI * 2);
        }
        ctx.stroke();
        ctx.fillStyle = '#e8eeff';
        for (const i of JOINTS) {
          if (!seen(pts[i])) continue;
          const [x, y] = px(pts[i]);
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
        // 눈과 골반은 정렬 기준이라 색을 달리한다. 화면 밖이어도 그린다 — 게임이 믿는 값이 그것이다.
        // 둘 다 판정이 쓰는 값 그대로 좌우 중점 하나로 찍는다
        ctx.fillStyle = accent;
        for (const p of [midpoint(pts[LM.EYE_L], pts[LM.EYE_R]), pts[HIP_MID]]) {
          const [x, y] = px(p);
          ctx.beginPath();
          ctx.arc(x, y, r * 1.4, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function searching() {
        ctx.save();
        ctx.fillStyle = 'rgba(232, 238, 255, 0.45)';
        ctx.font = `${Math.min(18, Math.max(11, w * 0.05))}px system-ui, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('몸을 찾는 중…', w / 2, h / 2);
        ctx.restore();
      }

      // 매 프레임 미리보기 전체를 다시 그린다 — 검은 배경, (준비 화면이면) 정렬 안내,
      // (디버그면) 판정 기준선, 맨 위에 졸라맨. 눈·골반 점은 준비 화면에서는 정렬 상태색,
      // 그 밖에는 하늘색이다
      function render(lm, { aligned, thresholds: d } = {}) {
        if (!w && !fit()) return;
        ctx.fillStyle = '#05070f';
        ctx.fillRect(0, 0, w, h);
        const accent = aligned == null ? '#6cc5ff' : aligned ? '#7ef6a0' : '#ffd166';
        if (aligned != null) guide(accent);
        if (d) thresholds(d);
        if (lm) skeleton(lm, accent);
        else searching();
      }

      // 판정 기준선 — 튜닝 도구. 디버그 패널이 열려 있을 때만 그린다
      function thresholds(d) {
        // 캘리브레이션 전이거나 몸을 못 찾은 프레임 — 그릴 기준선이 없다
        if (d.torsoLen == null) return;
        ctx.font = '10px ui-monospace, Menlo, monospace';

        // 세 선이 모두 눈 기준선에서 뻗는다. 점프는 위로, 슬라이드는 아래로 —
        // 판정이 한 축의 양끝이라는 구조가 화면에 그대로 보인다
        // 머리가 이 선 위로 올라가면 점프한다
        hline(d.baselineEyeY - cfg.jumpThreshold * d.torsoLen, '#7ef6a0', '점프');
        // 눈이 실선 아래로 내려가면 슬라이드가 걸리고, 점선 위로 올라와야 풀린다.
        // 두 선 사이가 히스테리시스 구간이다 — 여기서는 걸려 있든 풀려 있든 유지된다
        hline(d.baselineEyeY + cfg.slideThreshold * d.torsoLen, '#ffd166', '슬라이드');
        hline(d.baselineEyeY + cfg.slideThreshold * cfg.slideRelease * d.torsoLen,
              'rgba(255,209,102,0.5)', '해제', [3, 3], 'right');

        // 실선은 가운데서 나가는 경계, 점선은 가운데로 돌아오는 경계다.
        // 둘 사이 간격이 곧 레인 떨림을 막는 히스테리시스 폭이다
        vline(cfg.laneOutLeft, '#6cc5ff', []);
        vline(cfg.laneInLeft, 'rgba(108,197,255,0.5)', [3, 3]);
        vline(cfg.laneInRight, 'rgba(108,197,255,0.5)', [3, 3]);
        vline(cfg.laneOutRight, '#6cc5ff', []);
      }

      // 창 크기가 바뀌면 dpr 이 달라질 수 있다. 다음 draw 에서 다시 잡게 한다
      function invalidate() { w = 0; }

      return { render, clear, invalidate };
    }
    // ── 화면 전환·API·부트
    // #canvas 는 3D 전용이다. 여기에 2D 컨텍스트를 한 번이라도 요청하면 WebGL 을 얻을 수 없다
    const canvas = document.getElementById('canvas');
    const hud = document.getElementById('hud');
    const hudCtx = hud.getContext('2d');

    function resizeHud() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      hud.width = Math.floor(window.innerWidth * dpr);
      hud.height = Math.floor(window.innerHeight * dpr);
      // 백킹 스토어는 dpr 배 크지만 좌표는 CSS 픽셀로 다룬다. 캔버스 한 단위 = 화면 1px
      hudCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeHud);
    resizeHud();

    // ── API — 시트는 부가 기능이다. 실패해도 게임은 계속 간다
    const API_SCORES = '/api/scores/';

    async function fetchTopScores() {
      const res = await fetch(API_SCORES);
      if (!res.ok) throw new Error('랭킹 조회 실패');
      return (await res.json()).scores;
    }

    async function submitScore(nickname, score) {
      // 네트워크가 블랙홀이면 fetch가 영영 안 끝나 게임오버 화면이 멈춘다. 타임아웃으로 실패시킨다
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);
      try {
        const res = await fetch(API_SCORES, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nickname, score }),
          signal: controller.signal,
        });
        if (!res.ok) throw new Error('점수 전송 실패');
      } finally {
        clearTimeout(timeoutId);
      }
    }

    // 움직임을 줄여달라는 설정은 연출에만 적용한다. 게임 자체는 내용이라 남는다
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

    function boot() {
      const el = (id) => document.getElementById(id);
      // 캔버스 fillText 는 '아직 안 받아진 웹폰트' 를 조용히 대체 글꼴로 그린다.
      // 점수에 쓰는 글자만 미리 받아둔다. 실패해도 대체 글꼴로 그려질 뿐이다
      document.fonts.load("400 46px 'Black Han Sans'", '0123456789점').catch(() => {});
      const startScreen = el('start');
      const countdownScreen = el('countdown');
      const gameoverScreen = el('gameover');
      const banner = el('banner');
      const toast = el('toast');
      const preview = el('preview');
      const cam = el('cam');

      const game = createGame();
      const keyboard = createKeyboardSource();
      const mapper = createInputMapper();
      const tracker = createPoseTracker();
      const panel = mountDebugPanel(mapper);
      // cfg 객체를 그대로 넘긴다 — 슬라이더가 이 객체를 제자리에서 바꾸므로 선이 즉시 따라온다
      const overlay = createPreviewOverlay(el('overlay'), mapper.cfg);
      window.addEventListener('resize', () => overlay.invalidate());

      let mode = 'keyboard';
      let poseReady = false;   // 세션 동안 카메라 파이프라인이 살아있는지. mode 는 라운드마다 결정된다
      let phase = 'start';
      // 준비 화면 — 자세가 선에 맞은 채로 흐른 시간이 ALIGN_HOLD_MS 를 채우면 시작한다.
      // 그래도 ALIGN_MAX_MS 안에 못 맞추면 그냥 시작한다 (맞춘 적이 있으면 그 자세로, 없으면 키보드)
      const ALIGN_HOLD_MS = 5000;
      const ALIGN_MAX_MS = 15000;
      let alignedMs = 0;
      let lastTickMs = 0;
      let countdownDeadlineMs = 0;
      let nickname = '플레이어';

      // show(null) 이면 셋 다 숨는다 — 플레이 중에는 화면 오버레이가 없다
      const show = (screen) => {
        for (const s of [startScreen, countdownScreen, gameoverScreen]) {
          s.classList.toggle('hidden', s !== screen);
        }
      };

      function showBanner(text) {
        banner.textContent = text ?? '';
        banner.style.display = text ? 'block' : 'none';
      }

      function showToast(text) {
        toast.textContent = text;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
      }

      async function loadRanking() {
        const list = el('ranking');
        try {
          const scores = await fetchTopScores();
          list.innerHTML = scores.length
            ? scores.map((s, i) =>
                `<li><span class="rk rk-${i + 1}">${i + 1}</span>` +
                `<span class="nm">${escapeHtml(s.nickname)}</span>` +
                `<span class="sc">${s.score}</span></li>`
              ).join('')
            : '<li class="rank-note">아직 기록이 없습니다</li>';
        } catch {
          list.innerHTML = '<li class="rank-note">랭킹을 불러올 수 없습니다</li>';
        }
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
