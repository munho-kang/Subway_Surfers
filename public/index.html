      // 3D 엔진은 CDN 에서 받는다. 받는 동안에도 시작 화면과 랭킹은 보인다.
      // 못 받으면 게임을 할 수 없다 — 보이지 않는 장애물을 피하라고 할 수는 없다
      let view3d = null;
      (async () => {
        try {
          const [THREE, { EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] =
            await Promise.all([
              import('three'),
              import('three/addons/postprocessing/EffectComposer.js'),
              import('three/addons/postprocessing/RenderPass.js'),
              import('three/addons/postprocessing/UnrealBloomPass.js'),
              import('three/addons/postprocessing/OutputPass.js'),
            ]);
          view3d = createRenderer3D(THREE, { EffectComposer, RenderPass, UnrealBloomPass, OutputPass }, canvas);
        } catch (e) {
          console.error('3D 화면을 불러오지 못했다', e);
          el('start-btn').disabled = true;
          showBanner('3D 화면을 불러오지 못했습니다. 새로고침하거나 다른 브라우저로 열어 주세요');
        }
      })();

      function paintIdle(nowMs) {
        const W = window.innerWidth, H = window.innerHeight;
        view3d?.renderIdle(nowMs, W, H);
        hudCtx.clearRect(0, 0, W, H);
        drawVignette(hudCtx, W, H, 0.6);
      }

      function paintPlay() {
        const W = window.innerWidth, H = window.innerHeight;
        const v = game.view();
        view3d?.render(v, W, H);
        hudCtx.clearRect(0, 0, W, H);
        // 점수판보다 먼저 칠해야 점수가 같이 어두워지지 않는다
        const t = (v.speed - BASE_SPEED) / (DARK_SPEED - BASE_SPEED);
        drawVignette(hudCtx, W, H, 0.55 + 0.45 * Math.min(1, Math.max(0, t)));
        drawHud(hudCtx, v);
      }

      // 카메라와 MediaPipe 는 시작 화면을 보는 동안 미리 띄운다
      (async () => {
        try {
          await tracker.start(preview);
          cam.classList.remove('hidden');
          poseReady = true;
        } catch (e) {
          console.warn('포즈 모드 불가 — 키보드로 진행한다', e);
          showToast('카메라를 쓸 수 없습니다. 화살표 키로 조작하세요');
        }
      })();

      el('start-btn').addEventListener('click', () => {
        nickname = el('nickname').value.trim().slice(0, 12) || '플레이어';
        phase = 'countdown';
        alignedMs = 0;
        lastTickMs = performance.now();
        countdownDeadlineMs = performance.now() + ALIGN_MAX_MS;
        // 카메라가 아직 안 떴어도 미리 붙인다. 뜨는 순간 바로 큰 화면으로 나온다
        cam.classList.add('align');
        overlay.invalidate();
        show(countdownScreen);
      });

      el('nickname').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') el('start-btn').click();
      });

      // 최종 점수는 0부터 올라간다. 방금 번 것이라는 느낌은 숫자가 움직여야 생긴다
      function countUp(node, to, ms) {
        if (reduceMotion.matches || to <= 0) {
          node.firstChild.textContent = String(to);
          return;
        }
        const t0 = performance.now();
        const tick = (t) => {
          const k = Math.min(1, (t - t0) / ms);
          node.firstChild.textContent = String(Math.round(to * (1 - Math.pow(1 - k, 3))));
          if (k < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }

      function setStatus(text, kind) {
        const node = el('submit-state');
        node.textContent = text;
        node.className = `status${kind ? ' ' + kind : ''}`;
      }

      async function finishGame() {
        phase = 'gameover';
        const score = game.getScore();
        const scoreNode = el('final-score');
        scoreNode.firstChild.textContent = '0';
        setStatus('점수를 보내는 중…', null);
        show(gameoverScreen);
        countUp(scoreNode, score, 720);
        // 애니메이션은 화면이 보인 뒤에 처음부터 다시 돌아야 한다
        const bar = el('restart-bar');
        bar.classList.remove('run');
        void bar.offsetWidth;
        bar.classList.add('run');
        try {
          await submitScore(nickname, score);
          setStatus('기록했습니다', 'ok');
        } catch {
          setStatus('점수를 보내지 못했습니다', 'bad');
        }
        setTimeout(async () => {
          phase = 'start';
          keyboard.reset();
          show(startScreen);
          await loadRanking();
        }, 2500);
      }

      function loop(nowMs) {
        requestAnimationFrame(loop);
        let landmarks = null;
        if (poseReady) {
          try {
            landmarks = tracker.read(nowMs);
          } catch (e) {
            // GPU 컨텍스트 유실 등으로 detectForVideo 가 죽어도 루프는 계속 돌아야 한다
            console.warn('포즈 추적이 중단됐다 — 키보드로 전환한다', e);
            poseReady = false;
            mode = 'keyboard';
            showBanner('카메라가 중단됐습니다. 화살표 키로 조작하세요');
          }
        }

        if (phase === 'countdown') {
          paintIdle(nowMs);
          // 자세가 선에 맞은 동안만 시간이 흐르고 기준 자세가 쌓인다. 뒤로 걸어가는 도중의
          // 자세가 기준에 섞이지 않는다. 카메라가 없으면 맞출 것이 없으니 그냥 흐른다
          const m = landmarks ? poseMetrics(landmarks) : null;
          const check = m && m.torsoLen > 1e-6
            ? alignCheck(m)
            : { aligned: false, hint: '카메라에 몸이 보이게 서세요' };
          const dt = Math.min(100, nowMs - lastTickMs);   // 탭이 가려졌다 돌아와도 한 번에 채우지 않는다
          lastTickMs = nowMs;
          if (!poseReady || check.aligned) alignedMs += dt;
          if (poseReady && check.aligned) mapper.addCalibrationSample(landmarks);
          if (poseReady) overlay.render(landmarks, { aligned: check.aligned });

          const msg = !poseReady ? '카메라가 없어 화살표 키로 시작합니다'
            : check.aligned ? '좋아요, 그대로 계세요' : check.hint;
          const msgNode = el('align-msg');
          if (msgNode.textContent !== msg) msgNode.textContent = msg;

          const left = Math.max(0, ALIGN_HOLD_MS - alignedMs);
          el('ring-track').style.setProperty('--p', (left / ALIGN_HOLD_MS).toFixed(4));
          const secs = String(Math.ceil(left / 1000));
          const countNode = el('count');
          if (countNode.textContent !== secs) {
            countNode.textContent = secs;
            // 매 프레임이 아니라 숫자가 바뀔 때만 튄다. 이 화면의 유일한 연출이다
            if (!reduceMotion.matches) {
              countNode.animate(
                [{ transform: 'scale(1.22)', opacity: 0.65 }, { transform: 'scale(1)', opacity: 1 }],
                { duration: 420, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' }
              );
            }
          }
          if (left <= 0 || nowMs >= countdownDeadlineMs) {
            // 큰 화면에 그린 선이 구석 썸네일에 축소돼 남지 않도록 지우고 나서 줄인다
            overlay.clear();
            cam.classList.remove('align');
            overlay.invalidate();
            if (poseReady && mapper.commitCalibration()) {
              mode = 'pose';
            } else {
              // 제한 시간 안에 자세를 한 번도 못 맞췄다. 이번 라운드는 포즈 조작이 불가능하다
              mode = 'keyboard';
              if (poseReady) showToast('자세를 맞추지 못했습니다. 화살표 키로 조작하세요');
            }
            phase = 'playing';
            show(null);
            game.reset(Math.floor(nowMs) % 100000, nowMs);
            keyboard.reset();
          }
          return;
        }

        if (phase !== 'playing') {
          paintIdle(nowMs);
          // 시작 화면에서도 졸라맨이 따라 움직여야 카메라가 살아있다는 것을 안다
          if (poseReady) overlay.render(landmarks);
          return;
        }

        let signal;
        if (mode === 'pose') {
          signal = mapper.update(landmarks, nowMs);
          showBanner(signal.warning);
        } else {
          signal = keyboard.read();
        }
        panel.update(mapper.getDebug(), signal.lane, mode);
        // 판정 기준선은 튜닝 도구다. 디버그 패널과 토글을 공유한다 (D 키)
        if (poseReady) {
          overlay.render(landmarks, {
            thresholds: panel.isVisible() && mode === 'pose' ? mapper.getDebug() : null,
          });
        }

        game.step(signal, nowMs);
        paintPlay();

        if (game.getState() === 'over') {
          showBanner(null);
          finishGame();
        }
      }

      show(startScreen);
      loadRanking();
      requestAnimationFrame(loop);
    }

    // 부트 분기는 파일 맨 끝이어야 한다. 위로 올리면 boot() 이 아직 초기화되지 않은
    // const API_SCORES 를 읽어 TDZ ReferenceError 가 난다
    if (new URLSearchParams(location.search).get('test') === '1') {
      renderSelfTests(runSelfTests());
    } else {
      boot();
    }
  </script>
</body>
</html>
